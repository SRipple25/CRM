/* Open deals valued as if they all close: client deals at their amount, company projects split into cash and equity. */
function potentialRevenue() {
  const open = list('deals').filter(d => stageKind(d.stage) === 'open');
  return open.reduce((a, d) => { const x = dealSplit(d); a.cash += x.cash; a.eq += x.eq; a.n++; return a; }, { cash: 0, eq: 0, n: 0 });
}

/* ================= ADVISORY AGREEMENTS (basis points, cash + equity) =================
   A company can have an advisory agreement: we advise on their redevelopment
   projects for X basis points of each project's value, split between cash at
   closing and equity in the project. Each project is a deal with
   fee.structure = 'bps'. When the deal is Signed, the cash half becomes an
   invoice in the revenue ledger and the equity half is tracked on the deal
   (owed → issued → realized). Distributions and exit proceeds are recorded as
   revenue of type "Equity distribution / exit". */
REV_TYPES.splice(3, 0, ['advisory', 'Advisory fee (at closing)'], ['equity', 'Equity distribution / exit']);
REV_COLOR.advisory = '#7D5F1A'; REV_COLOR.equity = '#4F6B3A';
const EQ_STATUS = [['pending', 'Owed, not issued yet'], ['issued', 'Issued, held'], ['realized', 'Realized (sold or cashed out)'], ['forfeited', 'Forfeited']];
const EQ_PILL = { pending: 'gold', issued: 'green', realized: '', forfeited: 'red' };
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = s => Number(String(s == null ? '' : s).replace(/[^0-9.\-]/g, '')) || 0;
const bpsText = b => (Number(b) || 0) + ' bps (' + ((Number(b) || 0) / 100).toFixed(2).replace(/\.?0+$/, '') + '%)';

/* A company's advisory agreement drives the terms of its open projects,
   unless a deal is explicitly set to custom terms. Closed and lost projects
   keep the terms they had when they closed. */
function agreementFor(d) {
  const co = d && d.companyId && byId('companies', d.companyId);
  return co && co.advisory && co.advisory.active !== false && co.advisory.bps ? co.advisory : null;
}
function followsAgreement(d) {
  const f = d && d.fee || {};
  return f.structure === 'bps' && f.followAgreement !== false && (!d.stage || stageKind(d.stage) === 'open') && !!agreementFor(d);
}
function feeOf(d) {
  const f = d && d.fee || {};
  if (f.structure !== 'bps') return null;
  const ag = followsAgreement(d) ? agreementFor(d) : null;
  const pv = Number(f.projectValue) || 0, bps = Number(ag ? ag.bps : f.bps) || 0, src = ag ? ag.cashPct : f.cashPct, cashPct = src == null || src === '' ? 50 : Number(src);
  const total = round2(pv * bps / 10000), cashAmt = round2(total * cashPct / 100);
  return { pv, bps, cashPct, total, cash: cashAmt, equity: round2(total - cashAmt), entity: f.entity || '' };
}
function feeSummary(fee) { return bpsText(fee.bps) + ' of ' + money(fee.pv) + ' = ' + cash(fee.total) + ': ' + cash(fee.cash) + ' cash at closing, ' + cash(fee.equity) + ' in equity'; }

}

function feeFromForm(o) {

  if ('followAgreement' in o) {

    if (a) { fee.bps = Number(a.bps) || 0; fee.cashPct = a.cashPct == null ? 50 : Number(a.cashPct); }

/* Push the agreement's terms into every open project that follows it. */
async function syncAgreementDeals(coId) {
  const co = byId('companies', coId), a = co && co.advisory; if (!a) return 0;
  let n = 0;
  for (const d of list('deals').filter(d => d.companyId === coId && d.fee && d.fee.structure === 'bps' && d.fee.followAgreement !== false && stageKind(d.stage) === 'open')) {
    const fee = Object.assign({}, d.fee, { bps: Number(a.bps) || 0, cashPct: a.cashPct == null ? 50 : Number(a.cashPct) });
    const total = round2((Number(fee.projectValue) || 0) * fee.bps / 10000);
    if (Number(d.fee.bps) !== fee.bps || Number(d.fee.cashPct) !== fee.cashPct || Number(d.amount) !== total) { await store.update('deals', d.id, { fee, amount: total, updatedAt: Date.now() }); n++; }
  }
  return n;
}

/* ---------- when a bps deal is Signed ---------- */
async function onDealWon(id) {
  const d0 = byId('deals', id);
  const ag = d0 && d0.fee && d0.fee.structure === 'bps' && d0.fee.followAgreement !== false && agreementFor(d0);
  if (ag) { const f = Object.assign({}, d0.fee, { bps: Number(ag.bps), cashPct: ag.cashPct == null ? 50 : Number(ag.cashPct) }); await store.update('deals', id, { fee: f, amount: round2((Number(f.projectValue) || 0) * f.bps / 10000) }); }
  const d = Object.assign({}, byId('deals', id), ag ? { fee: Object.assign({}, d0.fee, { bps: Number(ag.bps), cashPct: ag.cashPct == null ? 50 : Number(ag.cashPct) }) } : {});
  const fee = feeOf(Object.assign({}, d, { stage: 'co_closed' })); if (!fee) return;
  const has = list('revenue').some(r => r.dealId === id && r.feeRole === 'closing_cash');
  const co = byId('companies', d.companyId);
  if (!has && fee.cash > 0) {
    await store.add('revenue', { clientId: d.clientId || null, companyId: d.companyId || null, dealId: id, contactId: d.contactId || null, type: 'advisory', feeRole: 'closing_cash', amount: fee.cash, status: 'invoiced', date: d.closeDate && d.closeDate > Date.now() - 30 * DAY ? d.closeDate : Date.now(), paidBy: co ? co.name : 'Client', description: d.name + ' closing fee (' + fee.cashPct + '% cash)', notes: bpsText(fee.bps) + ' of ' + money(fee.pv) + ' = ' + cash(fee.total) + ' total fee; ' + cash(fee.equity) + ' taken as equity', createdAt: Date.now(), createdBy: meName(), updatedAt: Date.now() });
  }
  if (!d.equity && fee.equity > 0) await store.update('deals', id, { equity: { status: 'pending', basis: fee.equity, estValue: fee.equity, entity: fee.entity, ownership: '', issuedAt: null, notes: '', updatedAt: Date.now() } });
  if ((!has && fee.cash > 0) || (!d.equity && fee.equity > 0)) {
    await logAct({ type: 'system', contactId: d.contactId || null, dealId: id, clientId: d.clientId || null, body: 'Closed: ' + cash(fee.cash) + ' closing fee invoiced, ' + cash(fee.equity) + ' equity owed' + (fee.entity ? ' in ' + fee.entity : '') });
    toast(cash(fee.cash) + ' closing invoice created; ' + cash(fee.equity) + ' equity tracked');
  }
}

    submit: async o => {

ACT.delAdvisory = async d => { if (!(await ask('Remove the advisory agreement? Existing deals keep their fee terms.', 'Remove'))) return; await store.update('companies', d.id, { advisory: DEL }); closeModal(); };
function advisoryCard(co) {
  const a = co.advisory;
  if (!a) return `<div class="card"><div class="bd row" style="justify-content:space-between;flex-wrap:wrap"><div><b>Advisory agreement</b><div class="sub">Advising this company on projects for basis points, cash and equity?</div></div><button class="btn sm" data-act="editAdvisory" data-id="${co.id}">${ic('plus')}Set up</button></div></div>`;

      <div><div class="l">Equity held</div><div class="v">${cash(held.reduce((s, d) => s + (+d.equity.estValue || 0), 0))}</div><div class="sub">${cash(held.reduce((s, d) => s + (+d.equity.basis || 0), 0))} basis · ${held.length} stake${held.length === 1 ? '' : 's'}</div></div>

/* ---------- firm-wide equity portfolio (Revenue page) ---------- */
function equityPortfolio() {
  const ds = list('deals').filter(d => d.equity);
  const live = ds.filter(d => d.equity.status === 'pending' || d.equity.status === 'issued');
  return { ds, live, basis: live.reduce((s, d) => s + (+d.equity.basis || 0), 0), est: live.reduce((s, d) => s + (+d.equity.estValue || 0), 0), owed: live.filter(d => d.equity.status === 'pending').reduce((s, d) => s + (+d.equity.basis || 0), 0) };
}
function equityCard() {
  const p = equityPortfolio(); if (!p.ds.length) return '';
  const rows = p.ds.slice().sort((a, b) => (b.equity.estValue || 0) - (a.equity.estValue || 0)).map(d => {
    const co = byId('companies', d.companyId), dist = total(list('revenue').filter(r => r.dealId === d.id && r.type === 'equity' && r.status === 'paid'));
    return `<tr class="click" data-act="openDeal" data-id="${d.id}"><td><div class="name">${esc(d.equity.entity || d.name)}</div><div class="sub">${esc(d.name)}${co ? ' · ' + esc(co.name) : ''}</div></td>
      <td><span class="pill ${EQ_PILL[d.equity.status] || ''}">${esc(lbl(EQ_STATUS, d.equity.status).split(',')[0])}</span>${d.equity.ownership ? `<div class="sub">${esc(d.equity.ownership)}</div>` : ''}</td>

  }).join('');

    <div class="tblwrap"><table class="tbl"><thead><tr><th>Stake</th><th>Status</th><th style="text-align:right">Basis</th><th style="text-align:right">Est. value</th><th style="text-align:right">Distributed</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

/* On startup, bring every open project in line with its company's agreement (once per session). */
let _agreeSynced = false;
async function syncAllAgreements() {
  if (_agreeSynced) return; _agreeSynced = true;
  let n = 0;
  for (const co of list('companies').filter(c => c.advisory && c.advisory.active !== false && c.advisory.bps)) n += await syncAgreementDeals(co.id);

/* ================= LOCAL MODE =================
   When no Firebase config is pasted in, the CRM runs entirely in this browser:
   - "My data" (starts blank) or "Sample data" (the demo), kept under separate keys
   - backup / restore to a JSON file (the same file imports into the live version)
   - emails open as a pre-filled Gmail draft and are logged
   - a preview automation engine runs workflows and sequences in the browser;
     everything happens for real except that emails are logged, not sent */

/* ---------- start screen ---------- */
function renderWelcome() {
  $('#root').innerHTML = `<div class="login"><div class="box" style="width:min(460px,calc(100vw - 32px));text-align:left">
    ${brandMark()}
    <p style="margin:10px 0 22px">Runs right here in your browser. Everything you enter is saved on this computer, and you can download a backup any time.</p>
    ${STORAGE_OK ? '' : `<div class="banner" style="margin:0 0 16px;background:var(--red-soft);border-color:#E8C3BE;color:var(--red)">This window can't save data (it's a preview). Download the file and open it in Chrome, Edge, or Safari to keep what you enter.</div>`}
    <button class="btn primary" style="width:100%;justify-content:center;padding:12px;margin-bottom:10px" data-act="chooseMode" data-v="mine">Start with my own data</button>
    <button class="btn" style="width:100%;justify-content:center;padding:12px;margin-bottom:10px" data-act="chooseMode" data-v="sample">Explore with sample data first</button>
    <button class="btn ghost" style="width:100%;justify-content:center" data-act="restore">Restore from a backup</button>
    <p class="hint" style="margin:18px 0 0">Email automation runs as a preview here: workflows, tasks, and sequences all work, and emails are logged as "would send" instead of going out.</p>
  </div></div>`;
}
const DATA_KEYS = { mine: 'legacycrm_local_v1', sample: 'legacycrm_demo_v10' };
function freshData() {
  return { settings: { general: { firmName: DEFAULT_FIRM, senderName: '', signature: '', team: clone(DEFAULT_TEAM), sources: clone(DEFAULT_SOURCES), me: DEFAULT_TEAM[0].name }, pipeline: { stages: clone(DEFAULT_STAGES) } } };
}
function startLocal(seed) {
  store = new LocalStore(DATA_KEYS[MODE] || DATA_KEYS.mine);
  if (seed) { store.data = seed; store.save(); }
  if (!store.data) { store.data = MODE === 'sample' ? demoData() : freshData(); store.save(); }
  S.user = { email: '', displayName: '' };
  renderShell(); subscribeAll(); schedule(false);
  try { if (navigator.storage && navigator.storage.persist) Promise.resolve(navigator.storage.persist()).catch(() => { }); } catch (e) { }
  localEngineStart();
}
function setMode(m, seed) {
  MODE = m;
  try { localStorage.setItem(MODE_KEY, m); } catch (e) { }
  startLocal(seed);
}
ACT.chooseMode = d => setMode(d.v);
ACT.switchMode = async d => {
  const to = d.v;
  const msg = to === 'sample' ? 'Switch to the sample data? Your own data stays saved and you can switch back any time.' : 'Switch back to your own data?';
  if (!(await ask(msg, 'Switch'))) return;
  try { localStorage.setItem(MODE_KEY, to); } catch (e) { }
  if (STORAGE_OK) location.reload(); else toast('Switching needs a browser that can save. Open the file in Chrome, Edge, or Safari.', 'error');
};
ACT.eraseLocal = async () => {
  if (!(await ask('Erase everything in "' + (MODE === 'sample' ? 'Sample data' : 'My data') + '" from this browser? This cannot be undone. Download a backup first if you might want it.', 'Erase'))) return;
  try { localStorage.removeItem(DATA_KEYS[MODE]); localStorage.removeItem(MODE_KEY); } catch (e) { }
  location.reload();
};

/* ---------- backup & restore ---------- */
const BACKUP_KEY = 'legacycrm_lastbackup';
const lastBackup = () => { try { return Number(localStorage.getItem(BACKUP_KEY + '_' + (MODE || 'live'))) || 0; } catch (e) { return 0; } };
function backupObject() {
  let data;
  if (LOCAL) data = clone(store.data);
  else {
    data = {};
    COLS.concat(['activities', 'jobs']).forEach(c => { data[c] = {}; list(c).forEach(d => { const o = Object.assign({}, d); delete o.id; data[c][d.id] = o; }); });
  }
  return { app: 'phillips-crm', version: 1, exportedAt: Date.now(), source: LOCAL ? 'local-' + MODE : 'live', data };
}
ACT.backup = () => {
  let text;
  try { text = JSON.stringify(backupObject(), null, 1); } catch (e) { console.error(e); toast('Could not build the backup: ' + e.message, 'error'); return; }
  if (!downloadFile('phillips-crm-backup-' + toDateInput(Date.now()) + '.json', text, 'application/json')) return;
  try { localStorage.setItem(BACKUP_KEY + '_' + (MODE || 'live'), String(Date.now())); } catch (e) { }
  toast('Backup downloaded. Keep it somewhere safe, like Google Drive.'); schedule(false);
};
ACT.restore = () => {
  openModal({
    title: 'Restore from a backup', wide: true,
    body: `<p class="hint" style="margin-top:0">Pick the backup file you downloaded, or paste the backup text you copied (for example from the preview window).</p>
      <div class="row" style="margin-bottom:12px"><button type="button" class="btn" data-act="restorePick">Choose backup file</button></div>
      <label class="f"><span>Or paste backup text</span><textarea id="restoreText" placeholder='Paste here. It starts with {"app": "phillips-crm"' style="width:100%;height:200px;font-family:ui-monospace,monospace;font-size:12px"></textarea></label>`,
    foot: `<button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn primary" data-act="restorePaste">Restore pasted text</button>`
  });
};
ACT.restorePaste = () => {
  const t = ($('#restoreText') || {}).value || '';
  if (!t.trim()) { toast('Paste the backup text first', 'error'); return; }
  closeModal(); applyBackupText(t.trim());
};
ACT.restorePick = () => {
  let inp = $('#restoreFile');
  if (!inp) {
    inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,.txt,text/plain'; inp.id = 'restoreFile'; inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => { const f = inp.files[0]; inp.value = ''; if (f) { closeModal(); readBackup(f); } });
  }
  inp.click();
};
function readBackup(file) {
  const r = new FileReader();
  r.onload = () => applyBackupText(r.result);
  r.readAsText(file);
}
async function applyBackupText(text) {
  {
    let obj; try { obj = JSON.parse(text); } catch (e) { toast('That is not a valid backup. Make sure you copied all of it.', 'error'); return; }
    if (!obj || !/^(phillips|legacy)-crm$/.test(obj.app) || !obj.data) { toast('That is not a CRM backup.', 'error'); return; }
    const n = Object.keys(obj.data.contacts || {}).length, k = Object.keys(obj.data.clients || {}).length;
    const when = obj.exportedAt ? fmtDT(obj.exportedAt) : 'unknown date';
    if (LOCAL) {
      if (!S.user) { setMode('mine', obj.data); toast('Restored ' + plural(n, 'contact') + ' and ' + plural(k, 'client')); return; }
      if (!(await ask('Replace everything in this browser with the backup from ' + when + ' (' + plural(n, 'contact') + ', ' + plural(k, 'client') + ')?', 'Replace'))) return;
      store.data = obj.data; store.save(); Object.keys(store.subs).forEach(c => store.emit(c));
      toast('Backup restored');
    } else {
      if (!(await ask('Import the backup from ' + when + ' into the shared database (' + plural(n, 'contact') + ', ' + plural(k, 'client') + ')? Records with the same ID are overwritten; nothing else is deleted.', 'Import'))) return;
      let done = 0, totalDocs = 0;
      Object.keys(obj.data).forEach(c => totalDocs += Object.keys(obj.data[c] || {}).length);
      toast('Importing ' + totalDocs + ' records…');
      for (const c of Object.keys(obj.data)) {
        for (const id of Object.keys(obj.data[c] || {})) {
          if (c === 'settings' && id === 'engine') continue;
          await store.set(c, id, obj.data[c][id]); done++;
          if (done % 100 === 0) toast(done + ' of ' + totalDocs + ' imported…');
        }
      }
      toast('Import finished: ' + done + ' records');
    }
  }
}
function localBanner() {
  if (MODE === 'sample') return `<div class="banner row" style="justify-content:space-between;flex-wrap:wrap"><span><b>Sample data.</b> Click around freely. Your own data is kept separately.</span><button class="btn sm primary" data-act="switchMode" data-v="mine">Go to my data</button></div>`;
  if (!STORAGE_OK) return `<div class="banner" style="background:var(--red-soft);border-color:#E8C3BE;color:var(--red)"><b>Not saving.</b> This window can't store data. Download index.html and open it in Chrome, Edge, or Safari. Use <a href="#" data-act="backup">Download backup</a> to keep what you entered here.</div>`;
  const lb = lastBackup(), stale = !lb || Date.now() - lb > 7 * DAY, has = list('contacts').length + list('clients').length > 0;
  return `<div class="banner row" style="justify-content:space-between;flex-wrap:wrap;${stale && has ? '' : 'background:var(--card);border-color:var(--line);color:var(--muted)'}">
    <span><b style="color:var(--ink)">Local mode.</b> Saved in this browser on this computer. Emails open in Gmail; automations run as a preview. <span style="${stale && has ? 'font-weight:600' : ''}">Last backup: ${lb ? ago(lb) : 'never'}.</span></span>
    <button class="btn sm ${stale && has ? 'primary' : ''}" data-act="backup">${ic('download')}Back up now</button></div>`;
}
function localDataCard() {
  return `<div class="card"><div class="hd"><h3>Data in this browser</h3><span class="pill ${MODE === 'sample' ? 'gold' : 'green'}">${MODE === 'sample' ? 'Sample data' : 'My data'}</span></div><div class="bd">
    <div class="row" style="flex-wrap:wrap;margin-bottom:10px"><button class="btn primary" data-act="backup">${ic('download')}Download backup</button><button class="btn" data-act="restore">Restore from backup</button></div>
    <div class="row" style="flex-wrap:wrap">${MODE === 'sample' ? '<button class="btn" data-act="switchMode" data-v="mine">Go to my data</button>' : '<button class="btn" data-act="switchMode" data-v="sample">Look at sample data</button>'}
      <button class="btn danger" data-act="eraseLocal">Erase ${MODE === 'sample' ? 'sample' : 'my'} data</button></div>
    <div class="hint" style="margin-top:10px">Your data lives in this browser only. Clearing browsing data, or using a different browser or computer, will not show it. Back up weekly. When you go live with Firebase, sign in and use <b>Restore from backup</b> there to bring everything over.</div>
  </div></div>`;
}

/* ---------- email in local mode: open a Gmail draft and log it ---------- */

ACT.mailGo = async d => {
  const f = $('#mform'), c = byId('contacts', d.id); if (!f || !c) return;
  const v = mergeVars(c, null), g = S.settings.general || {};
  const subj = merge(f.elements.subject.value, v).trim();
  if (!subj) { toast('Add a subject', 'error'); return; }
  let body = merge(f.elements.body.value, v).replace(/<[^>]+>/g, '');
  if (g.signature && d.how !== 'log') body += '\n\n' + g.signature;
  if (d.how === 'gmail') window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(c.email) + '&su=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body), '_blank', 'noopener');
  if (d.how === 'app' && EMBEDDED) { toast("The mail app can't open from this preview window. Use Open in Gmail, or open the CRM in a full browser.", 'error'); return; }
  if (d.how === 'app') { const a =document.createElement('a'); a.href = 'mailto:' + encodeURIComponent(c.email) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body); a.click(); }
  await logAct({ type: 'email', contactId: c.id, subject: subj, preview: body.replace(/\s+/g, ' ').slice(0, 300), by: meName() + (d.how === 'log' ? '' : d.how === 'gmail' ? ' via Gmail' : ' via mail app') });
  await store.update('contacts', c.id, { lastEmailedAt: Date.now() });
  closeModal(); toast('Logged on the timeline');
};

/* ---------- preview automation engine (browser port of apps-script/Code.gs) ---------- */
const ENG = { timer: null, running: false, again: false, started: false };
function localEngineKick() { if (!LOCAL || !store || !store.data || !ENG.started) return; clearTimeout(ENG.timer); ENG.timer = setTimeout(localEngineRun, 700); }
function localEngineStart() { if (ENG.started) return; ENG.started = true; setInterval(localEngineRun, 20000); localEngineKick(); }

  const d = new Date(ts);
  for (let i = 0; i < 10; i++) {
    const day = d.getDay(), mins = d.getHours() * 60 + d.getMinutes();
    if (day === 0 || day === 6 || mins >= 17 * 60) { d.setDate(d.getDate() + 1); d.setHours(8, 30, 0, 0); continue; }
    if (mins < 8 * 60 + 30) d.setHours(8, 30, 0, 0);

async function engEnrollments(st) {

  for (const en of due) {
    const end = (status, reason) => store.update('enrollments', en.id, { status, stopReason: reason || '', endedAt: Date.now(), nextSendAt: null, forceNow: false });
    const seq = rawGet('sequences', en.sequenceId);
    if (!seq) { await end('stopped', 'Sequence deleted'); continue; }
    if (seq.paused && !en.forceNow) continue;
    const contact = rawGet('contacts', en.contactId);
    if (!contact) { await end('stopped', 'Contact deleted'); continue; }
    if (contact.status === 'unsubscribed') { await end('unsubscribed', 'Contact unsubscribed'); continue; }
    if (contact.status === 'bounced') { await end('bounced', 'Email bounced'); continue; }
    if (seq.weekdaysOnly && !en.forceNow) { const bt = businessTimeLocal(Date.now()); if (bt > Date.now() + 60000) { await store.update('enrollments', en.id, { nextSendAt: bt }); continue; } }

    if (!step) { await end('completed', ''); continue; }
    const tpl = rawGet('templates', step.templateId);
    let subject = step.subject || (tpl && tpl.subject) || '';
    const body = step.body || (tpl && tpl.body) || '';
    if (!subject && en.firstSubject) subject = /^re:/i.test(en.firstSubject) ? en.firstSubject : 'Re: ' + en.firstSubject;
    if (!body) { await end('error', 'Email ' + (en.stepIndex + 1) + ' has no content (template missing?)'); continue; }
    const s = await previewSend(contact, null, subject, body, 'Sequence: ' + seq.name + ' (email ' + (en.stepIndex + 1) + ') · preview, not sent');
    st.sent++;
    const next = en.stepIndex + 1, patch = { stepIndex: next, lastSentAt: Date.now(), sentCount: (en.sentCount || 0) + 1, forceNow: false };
    if (en.stepIndex === 0 || !en.firstSubject) patch.firstSubject = s;

- You cannot change anything directly. To create or change something, call a propose_* tool. The user sees each proposal as a card and must click Approve before anything is saved. Never say something "has been created" until the tool result confirms approval.
- Prefer one complete proposal over many small ones. If a request needs a new email, put it in the workflow's send_email step as newTemplate rather than proposing the template separately.
- Ask a short clarifying question only when you truly cannot pick sensible defaults. Otherwise make reasonable choices and say what you chose in one or two sentences.
- For quarter timing use trigger type before_quarter with days. Quarterly clients are billed on Jan 1, Apr 1, Jul 1 and Oct 1. "Quarterly clients" means quarterlyOnly: true.
- Steps run with the client's primary contact. create_task with assignee "__owner" goes to the client's advisor.
- Merge tags available in emails: {{firstName}} {{lastName}} {{fullName}} {{company}} {{email}} {{clientName}} {{tier}} {{advisor}} {{nextQuarter}} {{quarterStartDate}} {{reviewDate}} {{dealName}} {{senderName}} {{senderFirstName}} {{firmName}}. Use a fallback like {{firstName|there}}.
- Writing style for any email: ${g.aiStyle || DEFAULT_AI_STYLE}
- Answer questions from the CRM data below. Be concise; use short lists when helpful. If the data does not contain the answer, say so.

CRM data (JSON):
${JSON.stringify(aiSnapshot())}`;
}

/* ---------- API ---------- */
async function aiCall() {
  const key = aiKey(); if (!key) throw new Error('Add your Anthropic API key first (Settings > AI assistant).');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: aiModel(), max_tokens: 4000, system: aiSystem(), tools: AI_TOOLS, messages: AI.messages })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = (data.error && data.error.message) || ('HTTP ' + res.status);
    if (res.status === 401) throw new Error('The API key was rejected. Check it in Settings > AI assistant.');
    throw new Error('Claude API error: ' + msg);
  }
  return data;
}
async function aiTurn() {
  AI.busy = true; renderAI();
  try {
    const data = await aiCall();
    AI.messages.push({ role: 'assistant', content: data.content });
    (data.content || []).forEach(b => {
      if (b.type === 'text' && b.text.trim()) AI.items.push({ who: 'ai', text: b.text });
      if (b.type === 'tool_use') { const p = { id: b.id, tool: b.name, input: b.input, status: 'pending' }; AI.pending.push(p); AI.items.push({ who: 'proposal', p }); }
    });
  } catch (e) { AI.items.push({ who: 'error', text: e.message }); }
  AI.busy = false; renderAI();
}
async function aiSend(text) {
  text = (text || '').trim(); if (!text || AI.busy) return;
  const content = [];
  // any open proposals the user skipped are answered first, so the conversation stays valid
  const open = AI.pending.filter(p => p.status === 'pending' || p.status === 'done' || p.status === 'discarded');
  open.forEach(p => { if (p.status === 'pending') p.status = 'skipped'; content.push({ type: 'tool_result', tool_use_id: p.id, content: p.result || (p.status === 'skipped' ? 'The user did not approve this proposal and moved on.' : 'Discarded by the user.') }); });
  AI.pending = [];
  content.push({ type: 'text', text });
  AI.messages.push({ role: 'user', content });
  AI.items.push({ who: 'me', text });
  await aiTurn();
}
async function aiResolve(p) {
  // when every proposal from the last reply is decided, report back so Claude can confirm
  if (AI.pending.some(x => x.status === 'pending')) { renderAI(); return; }
  const content = AI.pending.map(x => ({ type: 'tool_result', tool_use_id: x.id, content: x.result || 'Discarded by the user.' }));
  AI.pending = [];
  AI.messages.push({ role: 'user', content });
  await aiTurn();
}

/* ---------- applying proposals ---------- */
function findContact(q) {
  q = norm(q); if (!q) return null;
  return list('contacts').find(c => norm(c.email) === q) || list('contacts').find(c => norm(fullName(c)) === q) || list('contacts').find(c => norm(fullName(c)).includes(q)) || null;
}
function cleanWorkflow(inp) {
  const t = Object.assign({}, inp.trigger || {});
  if (!AI_TRIGGER_TYPES.includes(t.type)) throw new Error('Unknown trigger "' + t.type + '"');
  Object.keys(t).forEach(k => { if (t[k] === '' || t[k] == null) delete t[k]; });
  const actions = (inp.actions || []).map(a => {
    if (!AI_ACTION_TYPES.includes(a.type)) throw new Error('Unknown step "' + a.type + '"');
    const x = Object.assign({}, a); delete x.newTemplate;
    if (a.type === 'send_email' && !a.newTemplate && !byId('templates', a.templateId)) throw new Error('A send email step points to a template that does not exist');
    if (a.type === 'enroll_sequence' && !byId('sequences', a.sequenceId)) throw new Error('An enroll step points to a sequence that does not exist');
    Object.keys(x).forEach(k => { if (x[k] === '' || x[k] == null) delete x[k]; });
    return { x, newTemplate: a.newTemplate || null };
  });
  if (!actions.length) throw new Error('The workflow has no steps');
  return { trigger: t, actions };
}
async function applyProposal(p) {
  const i = p.input || {};
  if (p.tool === 'propose_workflow') {
    const w = cleanWorkflow(i), acts = [];
    for (const a of w.actions) {
      if (a.newTemplate) { a.x.templateId = await store.add('templates', { name: a.newTemplate.name, subject: a.newTemplate.subject, body: a.newTemplate.body, unsubscribe: false, createdAt: Date.now(), updatedAt: Date.now(), createdBy: 'AI assistant' }); }
      acts.push(a.x);
    }
    const active = p.activate != null ? p.activate : !!i.active;
    const id = await store.add('workflows', { name: i.name || 'New workflow', description: i.description || '', active, allowReenroll: false, trigger: w.trigger, actions: acts, runCount: 0, createdAt: Date.now(), updatedAt: Date.now(), createdBy: meName() + ' via AI assistant' });
    if (active && isDateTrigger(w.trigger) && LOCAL) { ENG.forceDates = true; localEngineKick(); }
    p.link = { act: 'editWf', id };
    return 'Approved and saved as workflow "' + (i.name || 'New workflow') + '"' + (active ? ', turned on.' : ', currently off.') + (w.actions.some(a => a.newTemplate) ? ' Its email template was saved too.' : '');
  }
  if (p.tool === 'propose_template') {
    const id = await store.add('templates', { name: i.name, subject: i.subject, body: i.body, unsubscribe: false, createdAt: Date.now(), updatedAt: Date.now(), createdBy: 'AI assistant' });
    p.link = { act: 'editTpl', id };
    return 'Approved and saved as template "' + i.name + '".';
  }
  if (p.tool === 'propose_task') {
    const cl = i.clientName && list('clients').find(c => norm(c.name) === norm(i.clientName));
    const c = findContact(i.contactName) || (cl && byId('contacts', (cl.contactIds || [])[0])) || null;
    const assignee = team().some(t => t.name === i.assignee) ? i.assignee : (cl && cl.owner) || meName();
    await store.add('tasks', { title: i.title, contactId: c ? c.id : null, contactName: c ? fullName(c) : '', clientId: cl ? cl.id : null, assignee, due: startOfDay() + (Number(i.dueInDays) || 0) * DAY + 10 * 3600000, notes: i.notes || '', done: false, createdAt: Date.now(), createdBy: 'AI assistant' });
    return 'Approved. Task created for ' + assignee + '.';
  }
  if (p.tool === 'propose_email') {
    const c = findContact(i.contactName); if (!c || !c.email) throw new Error('Could not find a contact with an email for "' + i.contactName + '"');
    const g = S.settings.general || {}, v = mergeVars(c, null);
    const subj = merge(i.subject, v), body = merge(i.body, v) + (g.signature ? '\n\n' + g.signature : '');
    window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(c.email) + '&su=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body), '_blank', 'noopener');
    await logAct({ type: 'email', contactId: c.id, subject: subj, preview: body.replace(/\s+/g, ' ').slice(0, 300), by: meName() + ' via Gmail (drafted by AI assistant)' });
    await store.update('contacts', c.id, { lastEmailedAt: Date.now() });
    p.link = { act: 'openContact', id: c.id };
    return 'Approved. The draft opened in Gmail for the user to review and send, and it was logged on ' + fullName(c) + "'s timeline.";
  }
  throw new Error('Unknown proposal');
}
ACT.aiApprove = async d => {
  const p = AI.pending.find(x => x.id === d.id); if (!p || p.status !== 'pending') return;
  const chk = $('#aiAct_' + d.id); if (chk) p.activate = chk.checked;
  try { p.result = await applyProposal(p); p.status = 'done'; toast('Saved'); }
  catch (e) { p.status = 'error'; p.error = e.message; p.result = 'Could not be applied: ' + e.message; }
  await aiResolve(p);
};
ACT.aiDiscard = async d => { const p = AI.pending.find(x => x.id === d.id); if (!p) return; p.status = 'discarded'; await aiResolve(p); };
ACT.aiOpenLink = d => { if (ACT[d.a]) { if (d.a === 'editWf' || d.a === 'editTpl') AI.open = false; renderAI(); ACT[d.a]({ id: d.id }); } };

function mdLite(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code class="k">$1</code>')
    .split('\n').map(l => /^\s*[-*] /.test(l) ? '<li>' + l.replace(/^\s*[-*] /, '') + '</li>' : l).join('\n')
    .replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m.replace(/\n/g, '') + '</ul>').replace(/\n/g, '<br>');
}
function proposalCard(p) {
  const i = p.input || {}, st = p.status;

      ${st === 'pending' ? `<label class="check" style="margin:8px 0 0"><input type="checkbox" id="aiAct_${p.id}" ${i.active ? 'checked' : ''}> Turn it on when approved</label>` : ''}`;

  return `<div class="aiprop ${st}"><div class="aip-h">${ic('spark')}<span>${esc(title)}</span></div><div class="aip-b">${body}</div>${foot}</div>`;

  for (const j of list('jobs').filter(j => j.workflowId === S.draftId && j.status === 'pending')) await store.update('jobs', j.id, { status: 'cancelled', dueAt: null, result: 'Workflow deleted' });
  await store.remove('workflows', S.draftId); go('workflows');
};

VIEWS.log = () => {
  const tab = S.f.logTab;
  const jobs = list('jobs'), ens = list('enrollments');
  const pending = jobs.filter(j => j.status === 'pending').sort((a, b) => a.runAt - b.runAt);
  const upcoming = ens.filter(e => e.status === 'active').sort((a, b) => a.nextSendAt - b.nextSendAt);
  const emails = list('activities').filter(a => a.type === 'email').sort((a, b) => b.at - a.at).slice(0, 200);
  const errs = jobs.filter(j => j.status === 'error').concat(ens.filter(e => e.status === 'error'));
  const tabs = [['queue', 'Scheduled (' + (pending.length + upcoming.length) + ')'], ['emails', 'Sent emails'], ['errors', 'Errors (' + errs.length + ')']];
  const cname = id => { const c = byId('contacts', id); return c ? `<a href="#" data-act="openContact" data-id="${c.id}">${esc(fullName(c))}</a>` : '<span class="muted">deleted</span>'; };
  let body = '';
  if (tab === 'queue') body = `<div class="secthd">Sequence emails up next</div>
    <div class="card tblwrap">${upcoming.length ? `<table class="tbl"><thead><tr><th>Sends</th><th>Contact</th><th>Sequence</th><th>Email</th><th></th></tr></thead><tbody>${upcoming.slice(0, 150).map(e => { const s = byId('sequences', e.sequenceId); return `<tr><td>${fmtDT(e.nextSendAt)} <span class="sub">${ago(e.nextSendAt)}</span></td><td>${cname(e.contactId)}</td><td>${esc(e.sequenceName)}${s && s.paused ? ' <span class="pill amber">paused</span>' : ''}</td><td>${e.stepIndex + 1} of ${s ? (s.steps || []).length : '?'}</td><td class="w0">${LOCAL ? `<button class="btn sm" data-act="runEnNow" data-id="${e.id}">Run now</button>` : ''}</td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">Nothing scheduled.</div>'}</div>
    <div class="secthd">Workflow steps and one-off emails</div>
    <div class="card tblwrap">${pending.length ? `<table class="tbl"><thead><tr><th>Runs</th><th>Action</th><th>Contact</th><th>From</th><th></th></tr></thead><tbody>${pending.map(j => `<tr><td>${fmtDT(j.runAt)} <span class="sub">${ago(j.runAt)}</span></td><td>${esc(jobLabel(j))}</td><td>${cname(j.contactId)}</td><td class="sub">${esc(j.workflowName ? 'Workflow: ' + j.workflowName : j.createdBy || '')}</td><td class="w0">${LOCAL ? `<button class="btn sm" data-act="runJobNow" data-id="${j.id}">Run now</button> ` : ''}<button class="btn sm" data-act="cancelJob" data-id="${j.id}">Cancel</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Queue is empty.</div>'}</div>`;
  if (tab === 'emails') body = `<div class="card tblwrap">${emails.length ? `<table class="tbl"><thead><tr><th>Sent</th><th>To</th><th>Subject</th><th>Via</th></tr></thead><tbody>${emails.map(a => `<tr><td class="sub">${fmtDT(a.at)}</td><td>${cname(a.contactId)}</td><td>${esc(a.subject)}</td><td class="sub">${esc(a.by)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No emails sent yet.</div>'}</div>`;
  if (tab === 'errors') body = `<div class="card tblwrap">${errs.length ? `<table class="tbl"><thead><tr><th>When</th><th>What</th><th>Contact</th><th>Error</th><th></th></tr></thead><tbody>${errs.map(x => x.sequenceId ? `<tr><td class="sub">${fmtDT(x.lastSentAt || x.startedAt)}</td><td>Sequence: ${esc(x.sequenceName)}</td><td>${cname(x.contactId)}</td><td style="color:var(--red)">${esc(x.stopReason)}</td><td class="w0"><button class="btn sm" data-act="retryEn" data-id="${x.id}">Retry</button></td></tr>`
    : `<tr><td class="sub">${fmtDT(x.doneAt)}</td><td>${esc(jobLabel(x))}</td><td>${cname(x.contactId)}</td><td style="color:var(--red)">${esc(x.result)}</td><td class="w0"><button class="btn sm" data-act="retryJob" data-id="${x.id}">Retry</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No errors. Nice.</div>'}</div>`;
  return {
    title: 'Automation log',
    body: `<div class="card" style="margin-bottom:16px"><div class="bd">${engineCard()}</div></div>
    <div class="toolbar">${tabs.map(t => `<button class="btn ${tab === t[0] ? 'primary' : ''}" data-act="logTab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`
  };
};

ACT.stageDel = d => {
  const s = S.draft.stages[+d.i], n = list('deals').filter(x => x.stage === s.id).length;
  if (n) return toast(plural(n, 'deal') + ' are in ' + s.name + '. Move them first.', 'error');
  if (list('workflows').some(w => (w.trigger && w.trigger.stage === s.id) || (w.actions || []).some(a => a.stage === s.id))) return toast('A workflow uses this stage. Update it first.', 'error');
  S.draft.stages.splice(+d.i, 1); renderMain();
};

ACT.saveSettings = async () => {
  const d = S.draft;
  d.stages.forEach(s => { s.name = (s.name || '').trim(); if (!s.kind) delete s.kind; });
  if (d.stages.some(s => !s.name)) return toast('Every stage needs a name', 'error');
  if (!d.stages.some(s => !s.kind)) return toast('Keep at least one open stage', 'error');
  d.general.tierStartup = d.general.tierStartup || {}; STD_TIERS.forEach(t => { d.general.tierStartup[t[0]] = Math.max(0, Number(d.general.tierStartup[t[0]]) || 0); });
  STD_TIERS.forEach(t => { d.general.tierFees[t[0]] = Math.max(0, Number(d.general.tierFees[t[0]]) || DEFAULT_TIER_FEES[t[0]]); });
  TIERS.forEach(t => { d.general.cadence[t[0]] = Math.max(1, Number(d.general.cadence[t[0]]) || DEFAULT_CADENCE[t[0]]); });
  d.general.team = d.general.team.filter(t => (t.name || '').trim()).map(t => ({ name: t.name.trim(), email: (t.email || '').trim().toLowerCase() }));
  await store.set('settings', 'general', d.general, true);
  await store.set('settings', 'pipeline', { stages: d.stages }, true);
  toast('Settings saved');
};

/* ================= DATE-BASED WORKFLOW TRIGGERS =================
   Workflows that fire on the calendar instead of on an event:
   - before_quarter: N days before each new quarter starts
   - before_review:  N days before a client's next review date
   - after_signing:  N days after a client signs
   Each fires once per client per occurrence (per quarter, per review date). */
Object.assign(TRIGGERS, {
  before_quarter: 'Days before each new quarter (clients)',
  before_review: "Days before a client's review date",
  after_signing: 'Days after a client signs'
});
const DATE_TRIGGERS = new Set(['before_quarter', 'before_review', 'after_signing']);
const isDateTrigger = t => !!t && DATE_TRIGGERS.has(t.type);
const trigDays = t => (t.days === '' || t.days == null) ? 14 : Math.max(0, Number(t.days) || 0);
function dateTriggerSummary(t) {
  const n = trigDays(t), d = plural(n, 'day');
  let s = t.type === 'before_quarter' ? d + ' before each new quarter' : t.type === 'before_review' ? d + " before a client's review date" : d + ' after a client signs';
  const who = [];
  if (t.tier) who.push(lbl(TIERS, t.tier) + ' clients');
  if (t.quarterlyOnly) who.push('with a quarterly fee plan');
  if (t.currentOnly !== false) who.push('current clients only');
  return s + (who.length ? ' · ' + who.join(', ') : '');
}
function clientHasQuarterly(cl) { return (cl.feePlans || []).some(p => p.frequency === 'quarterly' && p.active !== false && (!p.end || p.end >= startOfDay())); }
/* Which clients should fire this workflow today, and the occurrence key for each. */
function dateTriggerHits(wf, clients, now) {
  const t = wf.trigger || {}, days = trigDays(t), today = startOfDay(now || Date.now()), out = [];
  clients.forEach(cl => {
    if (t.currentOnly !== false && (cl.status === 'former' || cl.status === 'paused')) return;
    if (t.tier && cl.tier !== t.tier) return;
    if (t.quarterlyOnly && !clientHasQuarterly(cl)) return;
    let key = null;
    if (t.type === 'before_quarter') {
      const Q = addMonths(quarterStart(today), 3);
      if (today >= Q - days * DAY) key = 'q:' + quarterKey(Q);
    } else if (t.type === 'before_review' && cl.nextReview) {
      const R = startOfDay(cl.nextReview);
      if (today >= R - days * DAY && today <= R) key = 'r:' + toDateInput(R);
    } else if (t.type === 'after_signing') {
      const F = startOfDay(cl.since || cl.createdAt || today) + days * DAY;
      if (today >= F && today <= F + 7 * DAY) key = 's';
    }
    if (key && !((cl.workflowRuns || {})[wf.id + '|' + key])) out.push({ client: cl, key });
  });
  return out;
}
/* The next date a date-based workflow would fire (for the editor preview). */
function nextDateFire(t) {
  if (t.type !== 'before_quarter') return null;
  const today = startOfDay(), days = trigDays(t);
  let Q = addMonths(quarterStart(today), 3);
  if (today > Q - days * DAY) return { fire: today, q: Q, now: true };
  return { fire: Q - days * DAY, q: Q };
}
/* Merge tags that come from the client record. */
function clientVars(cl) {
  const nq = addMonths(quarterStart(), 3);
  return {
    clientName: cl ? cl.name : '', tier: cl ? lbl(TIERS, cl.tier) : '', advisor: cl ? cl.owner || '' : '',
    nextQuarter: periodLabel(nq, 'quarterly'), quarterStartDate: new Date(nq).toLocaleDateString('en-US', { month: 'long', day: 'numeric' }),
    reviewDate: cl && cl.nextReview ? new Date(cl.nextReview).toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) : ''
  };
}
['clientName', 'tier', 'advisor', 'nextQuarter', 'quarterStartDate', 'reviewDate'].forEach(k => { if (!MERGE_TAGS.includes(k)) MERGE_TAGS.push(k); });
const _mergeVarsBase = mergeVars;
mergeVars = function (contact, deal, client) {
  const v = _mergeVarsBase(contact, deal);
  const cl = client || (contact && clientOf(contact.id)) || null;
  return Object.assign(v, clientVars(cl));
};
