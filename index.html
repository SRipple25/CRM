<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phillips CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121110'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='17' font-weight='700' fill='%23C8A24B' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#121110; --navy-2:#1E1C19; --navy-3:#2C2822;
  --gold:#C9A34E; --gold-2:#A8862F; --gold-soft:#F1E6C8;
  --ink:#1B1915; --muted:#6E6656; --faint:#A39A88;
  --line:#E2D9C6; --line-2:#ECE5D5;
  --bg:#F3EDE0; --card:#FBF8F1;
  --green:#2E7D4F; --green-soft:#E3F2E8;
  --red:#B93A32; --red-soft:#F8E4E2;
  --blue:#2B5FA8; --blue-soft:#E3ECF8;
  --amber:#A86A12; --amber-soft:#FBEFD9;
  --radius:10px;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --font:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#8A6A1F}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}

/* ---------- sidebar ---------- */
.side{background:var(--navy);color:#D8CFBD;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .mark{font-family:var(--serif);font-size:26px;font-weight:600;color:#fff;letter-spacing:.3px;line-height:1}
.brand .mark b{color:var(--gold);font-weight:600}
.brand .sub{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);margin-top:6px}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav .grp{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#857B68;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#D8CFBD;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--navy-2);color:#fff}
.nav button.on{background:var(--navy-3);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .count{margin-left:auto;font-size:11px;background:rgba(200,162,75,.18);color:var(--gold);padding:1px 7px;border-radius:10px}
.me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;font-size:12.5px}
.me .who{flex:1;min-width:0}
.me .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who .em{color:#8E846F;font-size:11px}
.me button{background:none;border:1px solid rgba(255,255,255,.15);color:#D8CFBD;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:20px 28px 0}
.top h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0;letter-spacing:.2px}
.top .spacer{flex:1}
.content{padding:18px 28px 60px}
.banner{margin:14px 28px 0;padding:10px 14px;border-radius:8px;background:var(--gold-soft);border:1px solid #E8D9B2;color:#6B5418;font-size:13px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#C9CED6}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold:hover{background:var(--gold-2);border-color:var(--gold-2)}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=tel],input[type=search],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,162,75,.18)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:12px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:10px;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--navy)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.muted{color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{max-width:300px}
.toolbar select{width:auto}

/* ---------- cards / tables ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card .hd h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.3px}
.card .bd{padding:14px 16px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#F5EFE2;position:sticky;top:0}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F7F1E3}
.tbl tr.sel td{background:#F4E9CC}
.tbl .w0{width:1%;white-space:nowrap}
.tblwrap{overflow:auto}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h4{font-family:var(--serif);font-size:22px;color:var(--ink);margin:0 0 6px;font-weight:600}
.name{font-weight:600}
.sub{color:var(--muted);font-size:12px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--line-2);color:var(--muted);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.gold{background:var(--gold-soft);color:#7A5E1C}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:5px;background:#ECE4D2;color:#4A4232;margin:0 4px 4px 0}
.tag button{border:0;background:none;padding:0;cursor:pointer;color:var(--faint);font-size:13px;line-height:1}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:#7A5E1C;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.avatar.lg{width:46px;height:46px;font-size:16px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.dash{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.dash .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.bars .b{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
.bars .track{height:10px;background:var(--line-2);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--gold);border-radius:6px}
.bars .amt{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.engine{display:flex;gap:12px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none;margin-top:5px}
.dot.ok{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.dot.bad{background:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.feed .it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.feed .it:last-child{border-bottom:0}
.feed .ic{width:26px;height:26px;border-radius:7px;background:var(--line-2);display:flex;align-items:center;justify-content:center;flex:none}
.feed .ic svg{width:14px;height:14px}
.feed .ic.email{background:var(--blue-soft);color:var(--blue)}
.feed .ic.note{background:var(--gold-soft);color:#7A5E1C}
.feed .ic.call{background:var(--green-soft);color:var(--green)}
.feed .ic.stage{background:#EDE7F6;color:#5B3E96}
.feed .ic.system{background:var(--line-2);color:var(--muted)}
.feed .tx{flex:1;min-width:0}
.feed .tx .t{color:var(--faint);font-size:11.5px}
.feed .tx .b{white-space:pre-wrap;color:#3C4859;margin-top:2px;overflow-wrap:anywhere}

/* ---------- kanban ---------- */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.colm{flex:0 0 264px;background:#EAE2D0;border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 170px)}
.colm .ch{padding:12px 14px 10px;border-bottom:2px solid var(--gold)}
.colm .ch .n{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.colm .ch .t{font-size:12px;color:var(--muted);margin-top:2px}
.colm.won .ch{border-color:var(--green)}
.colm.lost .ch{border-color:var(--faint)}
.colm .cards{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:80px;flex:1}
.colm.over{background:#E0D2AE}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.dcard:hover{border-color:var(--gold)}
.dcard.drag{opacity:.4}
.dcard .dn{font-weight:700;font-size:13px;margin-bottom:3px}
.dcard .dm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.dcard .amt{font-weight:700;color:var(--ink)}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,15,5,.42);z-index:40;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:41;box-shadow:-10px 0 40px rgba(20,15,5,.22);display:flex;flex-direction:column;animation:slide .2s ease-out}
.drawer .dh{background:var(--card);padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer .dh h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.drawer .db{flex:1;overflow:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
.drawer .acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;margin-left:auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.modal{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--card);border-radius:12px;box-shadow:0 20px 60px rgba(20,15,5,.35);animation:pop .15s}
.modal.wide{width:min(860px,calc(100vw - 24px))}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh h3{margin:0;font-family:var(--serif);font-size:22px;font-weight:600}
.modal .mb{padding:18px 20px;overflow:auto}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.scrim.top{z-index:50}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}

/* ---------- editors ---------- */
.flow{display:flex;flex-direction:column;align-items:stretch;max-width:720px}
.node{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.node .nh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F5EFE2;border-bottom:1px solid var(--line-2);font-weight:700;font-size:13px}
.node .nh .badge{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:#7A5E1C}
.node .nh .badge svg{width:14px;height:14px}
.node.trigger .nh{background:var(--navy);color:#fff}
.node.trigger .nh .badge{background:var(--gold);color:var(--navy)}
.node.delay .nh .badge{background:var(--blue-soft);color:var(--blue)}
.node .nb{padding:14px}
.node .nh .tools{margin-left:auto;display:flex;gap:2px}
.node .nh .tools button{border:0;background:none;cursor:pointer;color:var(--muted);padding:3px 6px;border-radius:5px;font-size:13px}
.node .nh .tools button:hover{background:var(--line-2);color:var(--ink)}
.node.trigger .nh .tools button{color:#B9C3D2}
.link{width:2px;height:22px;background:#CFC6AE;margin:0 auto}
.addstep{align-self:center;border:1.5px dashed #CFC6AE;background:none;border-radius:20px;padding:6px 14px;cursor:pointer;color:#7A5E1C;font-weight:600;font-size:12.5px}
.addstep:hover{background:var(--gold-soft)}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;font-size:11.5px;padding:3px 9px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;color:#5B4A1D}
.chip:hover{border-color:var(--gold);background:var(--gold-soft)}
.preview{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff;font-family:Arial,sans-serif;font-size:14px;line-height:1.5}
.preview .ps{font-weight:700;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.stats{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:8px}
.stats b{color:var(--ink);font-size:14px;display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{padding:16px;cursor:pointer;transition:border-color .1s}
.tile:hover{border-color:var(--gold)}
.tile h4{margin:0 0 4px;font-size:15px}
.switch{position:relative;width:36px;height:20px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CDD2DA;border-radius:20px;cursor:pointer;transition:.15s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{transform:translateX(16px)}
.bulk{position:sticky;bottom:16px;margin-top:14px;background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(20,15,5,.3)}
.bulk .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.bulk .btn:hover{border-color:var(--gold)}
.taskrow{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.taskrow:last-child{border-bottom:0}
.taskrow input{width:17px;height:17px;margin-top:2px;accent-color:var(--green)}
.taskrow.done .tt{text-decoration:line-through;color:var(--faint)}
.taskrow .tt{font-weight:600}
.secthd{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 8px}
.secthd:first-child{margin-top:0}
.stagelist .r{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.stagelist .r input{flex:1}
code.k{background:#ECE2CB;padding:1px 5px;border-radius:4px;font-size:12px}
pre.snip{background:var(--navy);color:#E9DDBB;padding:12px;border-radius:8px;font-size:11.5px;overflow:auto;white-space:pre-wrap;word-break:break-all}

/* ---------- toast / login ---------- */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;animation:pop2 .2s}
.toast.error{background:var(--red)}
@keyframes pop2{from{opacity:0;transform:translateY(8px)}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);background-image:radial-gradient(circle at 20% 10%,#2B2619 0,transparent 50%),radial-gradient(circle at 90% 90%,#3A2E12 0,transparent 45%)}
.login .box{background:var(--card);border-radius:14px;padding:38px 36px;width:min(380px,calc(100vw - 32px));text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login .mark{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--navy)}
.login .mark b{color:var(--gold-2);font-weight:600}
.login p{color:var(--muted);margin:8px 0 26px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;min-width:0}
  .me{display:none}
  .top{flex-wrap:wrap}
  .top h1{font-size:25px}
  .bars .b{grid-template-columns:100px 1fr 76px}
  .toolbar .search{max-width:none}
  .board{margin:0 -16px;padding:0 16px 12px}
  .nav{display:flex;overflow-x:auto;padding:6px}
  .nav .grp,.brand .sub,.me .who .em{display:none}
  .nav button{flex:none;width:auto}
  .brand{padding:14px 16px}
  .dash,.edgrid{grid-template-columns:1fr}
  .top,.content{padding-left:16px;padding-right:16px}
  .banner{margin-left:16px;margin-right:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .hide-m{display:none}
}

/* ---------- clients ---------- */
.pill.tier-platinum{background:#121110;color:#E9DDBB;letter-spacing:.3px}
.pill.tier-gold{background:#F1E1B0;color:#6B4F10}
.pill.tier-silver{background:#E3E1DC;color:#4E4A43}
.avatar.tier-av-platinum{background:#121110;color:#E9DDBB}
.avatar.tier-av-gold{background:#F1E1B0;color:#6B4F10}
.avatar.tier-av-silver{background:#E3E1DC;color:#4E4A43}
.tag.desig{background:#1E1C19;color:#E9DDBB;font-weight:600}
.schip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px 2px 7px;border-radius:5px;background:#EDE6D6;color:#4A4232;margin:0 4px 4px 0;white-space:nowrap}
.schip:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.schip.s-progress:before,.sdot.s-progress,.sdot.w-progress{background:var(--blue)}
.schip.s-implemented:before,.sdot.s-implemented,.sdot.w-done{background:var(--green)}
.schip.s-paused:before,.sdot.s-paused{background:var(--amber)}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;margin-top:6px}
.checkin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

<script>
'use strict';
/* =====================================================================

const FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT.firebaseapp.com",
  projectId: "PASTE_PROJECT",
  storageBucket: "PASTE_PROJECT.appspot.com",

const LOCAL = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('PASTE') === 0;

const MODE_KEY = 'legacycrm_mode';
const STORAGE_OK = (() => { try { localStorage.setItem('__lc_t', '1'); localStorage.removeItem('__lc_t'); return true; } catch (e) { return false; } })();

const FB_VER = '10.12.2';
const DEL = { __del: true };
const DEFAULT_FIRM = 'Phillips';

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const DAY = 86400000;
const money = n => (n == null || n === '') ? '—' : '$' + Math.round(Number(n) || 0).toLocaleString('en-US');
const moneyShort = n => { n = Number(n) || 0; return n >= 1e6 ? '$' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : '$' + Math.round(n); };
const fmtDate = t => t ? new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: new Date(t).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }) : '—';
const fmtDT = t => t ? new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
function ago(t) {
  if (!t) return '—';
  const d = Date.now() - t, a = Math.abs(d), m = Math.round(a / 60000);
  if (m < 1) return 'just now';
  let s;
  if (m < 60) s = m + 'm'; else if (m < 1440) s = Math.round(m / 60) + 'h'; else if (m < 43200) s = Math.round(m / 1440) + 'd'; else return fmtDate(t);
  return d < 0 ? 'in ' + s : s + ' ago';
}
const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
const fullName = c => c ? ([c.firstName, c.lastName].filter(Boolean).join(' ') || c.email || 'Unnamed') : '';
const norm = s => String(s || '').trim().toLowerCase();
const toDateInput = t => t ? new Date(t - new Date(t).getTimezoneOffset() * 60000).toISOString().slice(0, 10) : '';
const toDTInput = t => t ? new Date(t - new Date(t).getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
const fromDateInput = s => s ? new Date(s + 'T12:00:00').getTime() : null;
const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let a = o;
  for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[ks[i]]; }
  a[ks[ks.length - 1]] = v;
}
const opt = (v, label, sel) => `<option value="${esc(v)}"${String(sel) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;

/* ---------- merge tags (same rules as the engine) ---------- */
const MERGE_TAGS = ['firstName', 'lastName', 'fullName', 'company', 'title', 'email', 'dealName', 'dealAmount', 'senderName', 'senderFirstName', 'firmName'];
function mergeVars(contact, deal) {
  const g = S.settings.general || {};
  const co = contact && (byId('companies', contact.companyId) || {});
  const sender = g.senderName || meName();
  return {
    firstName: contact && contact.firstName || '', lastName: contact && contact.lastName || '',
    fullName: fullName(contact), email: contact && contact.email || '', title: contact && contact.title || '',
    company: (co && co.name) || (contact && contact.companyName) || '',
    dealName: deal && deal.name || '', dealAmount: deal && deal.amount ? money(deal.amount) : '',
    senderName: sender, senderFirstName: String(sender).split(' ')[0], firmName: firmName()
  };
}
function merge(str, v) {
  return String(str || '').replace(/\{\{\s*([\w.]+)\s*(?:\|([^}]*))?\}\}/g, (m, k, def) =>
    (v[k] != null && v[k] !== '') ? v[k] : (def != null ? def.trim() : ''));
}
function textToHtml(t) {
  t = String(t || '');
  if (/^\s*</.test(t)) return t;
  return t.split(/\n{2,}/).map(p => '<p style="margin:0 0 12px">' + esc(p).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1">$1</a>').replace(/\n/g, '<br>') + '</p>').join('');
}

/* ---------- data stores ---------- */
class LocalStore {
  constructor(key) { this.key = key; this.mem = null; this.subs = {}; this.failed = false; this.data = this.load() || null; }
  load() { try { const s = localStorage.getItem(this.key); return s ? JSON.parse(s) : null; } catch (e) { return this.mem; } }
  save() {
    this.mem = this.data;
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); this.failed = false; }
    catch (e) { if (!this.failed && STORAGE_OK) toast('Could not save to this browser (storage may be full). Download a backup from Settings now.', 'error'); this.failed = true; }
  }
  kick(c) { if ((c === 'events' || c === 'jobs' || c === 'enrollments') && typeof localEngineKick === 'function') localEngineKick(); }
  reset() { try { localStorage.removeItem(this.key); } catch (e) { } location.reload(); }
  col(c) { return this.data[c] = this.data[c] || {}; }
  snap(c) { return Object.keys(this.col(c)).map(id => Object.assign({ id }, this.col(c)[id])); }
  emit(c) { (this.subs[c] || []).forEach(cb => cb(this.snap(c))); }
  watch(c, cb) { (this.subs[c] = this.subs[c] || []).push(cb); setTimeout(() => cb(this.snap(c))); }
  async add(c, d) { const id = uid(); this.col(c)[id] = clone(d); this.save(); this.emit(c); this.kick(c); return id; }
  async set(c, id, d, mergeIt) { this.col(c)[id] = mergeIt ? Object.assign(this.col(c)[id] || {}, clone(d)) : clone(d); this.save(); this.emit(c); }
  async update(c, id, p) {
    const doc = this.col(c)[id]; if (!doc) return;
    Object.keys(p).forEach(k => {
      const ks = k.split('.'); let o = doc;
      for (let i = 0; i < ks.length - 1; i++) { o[ks[i]] = o[ks[i]] || {}; o = o[ks[i]]; }
      if (p[k] === DEL) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = clone(p[k]);
    });
    this.save(); this.emit(c); this.kick(c);
  }
  async remove(c, id) { delete this.col(c)[id]; this.save(); this.emit(c); }
}

class FirebaseStore {
  async init() {
    const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
    const [app, fs, au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    this.f = fs; this.au = au;
    this.app = app.initializeApp(FIREBASE_CONFIG);
    this.db = fs.getFirestore(this.app);
    this.auth = au.getAuth(this.app);
  }
  onUser(cb) { this.au.onAuthStateChanged(this.auth, cb); }
  signIn() { return this.au.signInWithPopup(this.auth, new this.au.GoogleAuthProvider()); }
  signOut() { return this.au.signOut(this.auth); }
  watch(c, cb, o = {}) {
    const f = this.f; let q = f.collection(this.db, c);
    if (o.orderBy) q = f.query(q, f.orderBy(o.orderBy, 'desc'), f.limit(o.limit || 500));
    return f.onSnapshot(q, s => cb(s.docs.map(d => Object.assign({ id: d.id }, d.data()))), err => {
      if (err.code === 'permission-denied') { S.denied = true; schedule(); }
      else toast('Sync error (' + c + '): ' + err.message, 'error');
    });
  }
  async add(c, d) { const r = await this.f.addDoc(this.f.collection(this.db, c), d); return r.id; }
  async set(c, id, d, mergeIt) { await this.f.setDoc(this.f.doc(this.db, c, id), d, { merge: !!mergeIt }); }
  async update(c, id, p) {
    const q = {}; Object.keys(p).forEach(k => q[k] = p[k] === DEL ? this.f.deleteField() : p[k]);
    await this.f.updateDoc(this.f.doc(this.db, c, id), q);
  }
  async remove(c, id) { await this.f.deleteDoc(this.f.doc(this.db, c, id)); }
}
let store = LOCAL ? null : new FirebaseStore();

/* ---------- state ---------- */

});

  const coOpen = open.filter(isCompanyDeal);

  const max = Math.max(1, ...byStage.map(b => b.amt));

    <label class="f"><span>First name</span><input type="text" name="firstName" value="${esc(c.firstName)}"></label>
    <label class="f"><span>Last name</span><input type="text" name="lastName" value="${esc(c.lastName)}"></label>
    <label class="f"><span>Email</span><input type="email" name="email" value="${esc(c.email)}"></label>
    <label class="f"><span>Phone</span><input type="tel" name="phone" value="${esc(c.phone)}"></label>
    <label class="f"><span>Company</span><input type="text" name="companyName" list="coList" value="${esc(c.companyName)}"></label>
    <label class="f"><span>Title</span><input type="text" name="title" value="${esc(c.title)}"></label>
    <label class="f"><span>Owner</span><select name="owner">${teamOpts(c.id ? c.owner : (c.owner || meName()))}</select></label>
    <label class="f"><span>Source</span><select name="source">${opt('', 'Unknown', c.source)}${sources().map(s => opt(s, s, c.source)).join('')}</select></label>
  </div><datalist id="coList">${list('companies').map(x => `<option value="${esc(x.name)}">`).join('')}</datalist>
  <label class="f"><span>Tags</span><input type="text" name="tags" value="${esc((c.tags || []).join(', '))}" placeholder="e.g. STR investor, cost seg"><div class="hint" style="margin-top:4px">Comma separated. New tags can trigger workflows.</div></label>
  ${c.id ? `<label class="f"><span>Email status</span><select name="status">${opt('active', 'Active', c.status || 'active')}${opt('unsubscribed', 'Unsubscribed (no automated email)', c.status)}${opt('bounced', 'Bounced', c.status)}</select></label>` : ''}`;
}
ACT.newContact = d => openModal({
  title: 'New contact', body: contactForm({ companyName: d.company ? (byId('companies', d.company) || {}).name : '' }),
  submit: async o => { if (!o.email && !o.firstName && !o.lastName) { toast('Add a name or email', 'error'); return false; } const id = await saveContact(o); toast('Contact added'); openDrawer('contact', id); }
});
ACT.editContact = d => { const c = byId('contacts', d.id); openModal({ title: 'Edit contact', body: contactForm(c), submit: async o => { await saveContact(o, c.id); toast('Saved'); } }); };
ACT.delContact = async d => {
  const c = byId('contacts', d.id); if (!await ask('Delete ' + fullName(c) + '?')) return;
  await stopAllFor(c.id, 'Contact deleted'); await store.remove('contacts', c.id); S.drawer = null; schedule(false); toast('Deleted');
};
SUBMIT.tag = async (o, f) => { await addTag(f.dataset.contact, o.tag); f.reset(); };
ACT.rmTag = d => removeTag(d.id, d.tag);
SUBMIT.note = async (o, f) => {
  if (!o.body) return;
  const touch = o.type === 'call' || o.type === 'meeting';
  await logAct({ type: touch ? 'contact' : 'note', channel: touch ? o.type : null, contactId: f.dataset.contact || null, dealId: f.dataset.deal || null, clientId: f.dataset.client || null, body: o.body });
  f.reset(); toast(touch ? (o.type === 'call' ? 'Call' : 'Meeting') + ' logged' : 'Note saved');
};
function noteBox(attrs, key) {
  return `<div class="card"><div class="bd"><form data-submit="note" ${attrs}><textarea name="body" data-keep="${key}" placeholder="Add a note or log a call" style="min-height:62px"></textarea>
    <div class="row" style="margin-top:8px;justify-content:flex-end"><select name="type" style="width:auto">${opt('note', 'Note')}${opt('call', 'Call')}${opt('meeting', 'Meeting')}</select><button class="btn sm primary">Save</button></div></form></div></div>`;
}
function emailStatusLabel(e) {
  return { active: 'blue', replied: 'green', completed: 'gold', stopped: '', error: 'red', unsubscribed: 'red', bounced: 'amber' }[e.status];
}
DRAWERS.contact = c => {
  const co = byId('companies', c.companyId);
  const deals = list('deals').filter(d => d.contactId === c.id);
  const ens = list('enrollments').filter(e => e.contactId === c.id).sort((a, b) => b.startedAt - a.startedAt);
  const tasks = list('tasks').filter(t => t.contactId === c.id && !t.done);
  const acts = list('activities').filter(a => a.contactId === c.id).sort((a, b) => b.at - a.at).slice(0, 100);
  const pend = list('jobs').filter(j => j.contactId === c.id && j.status === 'pending');
  return `<div class="dh"><span class="avatar lg">${initials(fullName(c))}</span><div style="min-width:0"><h2>${esc(fullName(c))}</h2>
    <div class="sub">${[c.title, co ? co.name : c.companyName].filter(Boolean).map(esc).join(' at ')}</div><div style="margin-top:6px">${statusPill(c)}</div></div>
    <button class="x" data-act="closeDrawer">×</button></div>
  <div class="acts">
    <button class="btn sm primary" data-act="emailContact" data-id="${c.id}">${ic('mail')}Email</button>
    <button class="btn sm" data-act="enrollOne" data-id="${c.id}">${ic('seq')}Enroll</button>
    <button class="btn sm" data-act="newTask" data-contact="${c.id}">${ic('check')}Task</button>
    <button class="btn sm" data-act="newDeal" data-contact="${c.id}">${ic('kanban')}Deal</button>
    ${clientOf(c.id) ? '' : `<button class="btn sm gold" data-act="newClient" data-contact="${c.id}">${ic('client')}Make client</button>`}
    <button class="btn sm" data-act="editContact" data-id="${c.id}">Edit</button>
    <button class="btn sm ghost danger" data-act="delContact" data-id="${c.id}">${ic('trash')}</button>
  </div>
  <div class="db">
    ${(cl => cl ? `<div class="card clientlink" data-act="openClient" data-id="${cl.id}"><div class="bd row">${ic('client')}<div style="flex:1"><b>${esc(cl.name)}</b> ${tierPill(cl.tier)}<div class="sub">Client · last contact ${daysAgo(lastContact(cl)).toLowerCase()} · ${esc(checkinText(checkin(cl)))}</div></div><span class="sub">Open →</span></div></div>` : '')(clientOf(c.id))}
    ${noteBox('data-contact="' + c.id + '" data-client="' + ((clientOf(c.id) || {}).id || '') + '"', 'note-' + c.id)}
    <div class="card"><div class="hd"><h3>Details</h3></div><div class="bd"><dl class="kv">
      <dt>Email</dt><dd>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '—'}</dd>
      <dt>Phone</dt><dd>${c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '—'}</dd>
      <dt>Company</dt><dd>${co ? `<a href="#" data-act="openCompany" data-id="${co.id}">${esc(co.name)}</a>` : esc(c.companyName || '—')}</dd>
      <dt>Owner</dt><dd>${esc(c.owner || 'Unassigned')}</dd><dt>Source</dt><dd>${esc(c.source || '—')}</dd>
      <dt>Created</dt><dd>${fmtDate(c.createdAt)}${c.createdBy ? ' by ' + esc(c.createdBy) : ''}</dd>
      <dt>Last emailed</dt><dd>${c.lastEmailedAt ? ago(c.lastEmailedAt) : 'Never'}</dd></dl>
      <div class="secthd" style="margin-top:14px">Tags</div>
      <div>${(c.tags || []).map(t => `<span class="tag">${esc(t)}<button data-act="rmTag" data-id="${c.id}" data-tag="${esc(t)}" title="Remove">×</button></span>`).join('') || '<span class="muted">No tags</span>'}</div>
      <form data-submit="tag" data-contact="${c.id}" class="row" style="margin-top:8px"><input type="text" name="tag" data-keep="tag-${c.id}" placeholder="Add a tag and press Enter"></form>
    </div></div>
    <div class="card"><div class="hd"><h3>Deals</h3><button class="btn sm ghost" data-act="newDeal" data-contact="${c.id}">${ic('plus')}</button></div>
      ${deals.length ? deals.map(d => `<div class="taskrow" style="cursor:pointer" data-act="openDeal" data-id="${d.id}"><div style="flex:1"><div class="tt">${esc(d.name)}</div><div class="sub">${esc(stageOf(d.stage).name)}</div></div><b>${money(d.amount)}</b></div>`).join('') : '<div class="bd muted">No deals</div>'}</div>
    <div class="card"><div class="hd"><h3>Sequences & scheduled email</h3></div>
      ${ens.length || pend.length ? ens.map(e => {
        const seq = byId('sequences', e.sequenceId), n = seq ? (seq.steps || []).length : '?';
        return `<div class="taskrow"><div style="flex:1"><div class="tt">${esc(e.sequenceName)}</div><div class="sub">${e.status === 'active' ? 'Step ' + Math.min(e.stepIndex + 1, n) + ' of ' + n + ' sends ' + ago(e.nextSendAt) : esc(e.status) + (e.stopReason ? ': ' + esc(e.stopReason) : '') + ' · ' + ago(e.endedAt || e.startedAt)}</div></div>
        <span class="pill ${emailStatusLabel(e)}">${esc(e.status)}</span>${e.status === 'active' ? `${LOCAL ? `<button class="btn sm" data-act="runEnNow" data-id="${e.id}" title="Send the next email now (preview)">Run now</button>` : ''}<button class="btn sm" data-act="markReplied" data-id="${e.id}" title="They replied">Replied</button><button class="btn sm" data-act="stopEn" data-id="${e.id}">Stop</button>` : ''}</div>`;
      }).join('') + pend.map(j => `<div class="taskrow"><div style="flex:1"><div class="tt">${esc(jobLabel(j))}</div><div class="sub">Scheduled ${fmtDT(j.runAt)}${j.workflowName ? ' by workflow ' + esc(j.workflowName) : ''}</div></div><button class="btn sm" data-act="cancelJob" data-id="${j.id}">Cancel</button></div>`).join('') : '<div class="bd muted">Not in any sequence</div>'}</div>
    <div class="card"><div class="hd"><h3>Open tasks</h3><button class="btn sm ghost" data-act="newTask" data-contact="${c.id}">${ic('plus')}</button></div>${tasks.length ? tasks.map(taskRow).join('') : '<div class="bd muted">None</div>'}</div>
    <div class="card"><div class="hd"><h3>Timeline</h3></div><div class="bd feed">${acts.length ? acts.map(a => feedItem(a, false)).join('') : '<div class="muted">No activity yet.</div>'}</div></div>
  </div>`;
};
ACT.stopEn = async d => { if (await ask('Remove from this sequence? No more emails will send.')) await stopEnrollment(d.id); };
ACT.cancelJob = async d => { await store.update('jobs', d.id, { status: 'cancelled', doneAt: Date.now(), dueAt: null, result: 'Cancelled by ' + meName() }); toast('Cancelled'); };

ACT.emailContact = async d => {
  const c = byId('contacts', d.id);
  if (!c.email) return toast('This contact has no email address', 'error');
  if (c.status === 'unsubscribed' && !await ask(fullName(c) + ' unsubscribed from automated email. Send a personal email anyway?')) return;
  if (LOCAL) return localEmailModal(c);
  const tpls = list('templates').slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  openModal({
    title: 'Email ' + fullName(c), wide: true,
    body: `<label class="f"><span>Start from a template</span><select data-change="pickTpl">${opt('', 'Blank email')}${tpls.map(t => opt(t.id, t.name)).join('')}</select></label>
      <label class="f"><span>To</span><input type="text" value="${esc(c.email)}" disabled></label>
      <label class="f"><span>Subject</span><input type="text" name="subject" data-merge></label>${chips()}
      <label class="f"><span>Message</span><textarea name="body" data-merge style="min-height:220px"></textarea></label>
      <div class="grid2"><label class="f"><span>Send</span><select name="when" data-change="whenSel">${opt('now', 'As soon as possible')}${opt('later', 'Schedule for later')}</select></label>
      <label class="f" id="whenAt" style="visibility:hidden"><span>Send at</span><input type="datetime-local" name="at" value="${toDTInput(Date.now() + DAY)}"></label></div>
      <div class="hint">Goes out from the engine's Gmail account within about 5 minutes, with your signature added. It will show in the timeline once sent.</div>`,
    foot: `<button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary">${ic('send')}Queue email</button>`,
    submit: async o => {
      if (!o.subject) { toast('Add a subject', 'error'); return false; }
      const runAt = o.when === 'later' && o.at ? new Date(o.at).getTime() : Date.now();
      await queueEmail(c.id, { subject: o.subject, body: $('#mform').elements.body.value, runAt });
      toast(runAt > Date.now() + 60000 ? 'Scheduled for ' + fmtDT(runAt) : 'Queued to send');
    }
  });
};
CHANGE.pickTpl = (d, t) => { const tp = byId('templates', t.value), f = $('#mform'); if (tp) { f.elements.subject.value = tp.subject || ''; f.elements.body.value = tp.body || ''; } };
CHANGE.whenSel = (d, t) => { $('#whenAt').style.visibility = t.value === 'later' ? 'visible' : 'hidden'; };
ACT.enrollOne = d => enrollModal([d.id]);
function enrollModal(ids) {
  const seqs = list('sequences').filter(s => !s.paused);
  if (!seqs.length) { toast('Create a sequence first (Automation > Sequences)', 'error'); return; }
  const who = ids.length > 1 ? plural(ids.length, 'contact') : fullName(byId('contacts', ids[0]));
  openModal({
    title: 'Enroll ' + who,
    body: `<div class="secthd">Choose a sequence</div>${seqs.map((s, i) => `<label class="check" style="align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px"><input type="radio" name="seq" value="${s.id}" ${i ? '' : 'checked'}><div><b>${esc(s.name)}</b><div class="hint">${plural((s.steps || []).length, 'email')} over ${(s.steps || []).reduce((a, st) => a + (Number(st.delayDays) || 0), 0)} days${s.stopOnReply !== false ? ' · stops on reply' : ''}</div></div></label>`).join('')}
      <div class="hint">Contacts who are unsubscribed, bounced, or already in the sequence are skipped. The first email goes out on the next engine run.</div>`,
    foot: `<button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary">${ic('seq')}Enroll</button>`,
    submit: async o => { await enroll(ids, o.seq); S.sel.clear(); schedule(false); }
  });
}

/* ================= COMPANIES ================= */
function dealSplit(d) { const fee = feeOf(d); return fee ? { cash: fee.cash, eq: fee.equity } : { cash: +d.amount || 0, eq: 0 }; }
VIEWS.companies = () => {
  const q = norm(S.f.q);
  let cos = list('companies').slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  if (q) cos = cos.filter(c => [c.name, c.domain, c.industry].some(x => norm(x).includes(q)));
  const cc = {}, m = {};
  list('contacts').forEach(c => { if (c.companyId) cc[c.companyId] = (cc[c.companyId] || 0) + 1; });
  cos.forEach(c => {
    const ds = dealsForCompany(c), open = ds.filter(d => stageKind(d.stage) === 'open');
    const x = { n: open.length, cash: 0, eq: 0, held: 0 };
    open.forEach(d => { const sp = dealSplit(d); x.cash += sp.cash; x.eq += sp.eq; });
    ds.forEach(d => { if (d.equity && (d.equity.status === 'pending' || d.equity.status === 'issued')) x.held += +d.equity.estValue || 0; });
    m[c.id] = x;
  });
  const T = cos.reduce((a, c) => { const x = m[c.id]; a.n += x.n; a.cash += x.cash; a.eq += x.eq; a.held += x.held; return a; }, { n: 0, cash: 0, eq: 0, held: 0 });
  const num = (v, cls) => v ? `<span class="${cls || ''}">${money(v)}</span>` : '<span class="faint">—</span>';
  return {
    title: 'Companies', actions: `<button class="btn primary" data-act="newCompany">${ic('plus')}New company</button>`,
    body: `<div class="toolbar"><input type="search" class="search" placeholder="Search companies" data-keep="cq" data-input="cq" value="${esc(S.f.q)}"><span class="muted">${plural(cos.length, 'company').replace('companys', 'companies')}</span></div>
    ${cos.length ? `<div class="pipesum card"><div><div class="l">Open pipeline</div><div class="v">${money(T.cash + T.eq)}</div><div class="sub">${plural(T.n, 'open deal')}</div></div>
      <div><div class="l"><i class="kdot cashc"></i>Cash</div><div class="v">${money(T.cash)}</div><div class="sub">paid at closing</div></div>
      <div><div class="l"><i class="kdot eqc"></i>Equity</div><div class="v eqc-t">${money(T.eq)}</div><div class="sub">received as ownership</div></div>
      <div><div class="l">Equity held</div><div class="v">${money(T.held)}</div><div class="sub">est. value of closed stakes</div></div>
      ${T.cash + T.eq ? `<div class="splitbar" title="${money(T.cash)} cash · ${money(T.eq)} equity"><span class="cashc" style="width:${T.cash / (T.cash + T.eq) * 100}%"></span><span class="eqc" style="width:${T.eq / (T.cash + T.eq) * 100}%"></span></div>` : ''}</div>
    <div class="card tblwrap"><table class="tbl"><thead><tr><th>Company</th><th class="hide-m">Industry</th><th class="hide-m">Contacts</th><th style="text-align:right">Open deals</th><th style="text-align:right"><i class="kdot cashc"></i>Pipeline cash</th><th style="text-align:right"><i class="kdot eqc"></i>Pipeline equity</th><th class="hide-m" style="text-align:right">Equity held</th></tr></thead><tbody>
    ${cos.map(c => { const x = m[c.id]; return `<tr class="click" data-act="openCompany" data-id="${c.id}"><td><div class="name">${esc(c.name)}${c.advisory && c.advisory.active !== false ? ` <span class="pill gold">Advisory · ${esc(c.advisory.bps)} bps</span>` : ''}</div><div class="sub">${esc(c.domain || '')}</div></td><td class="hide-m">${esc(c.industry || '')}</td><td class="hide-m">${cc[c.id] || 0}</td>
      <td style="text-align:right">${x.n || '<span class="faint">0</span>'}</td><td class="numc">${num(x.cash)}</td><td class="numc">${num(x.eq, 'eqc-t')}</td><td class="numc hide-m">${num(x.held)}</td></tr>`; }).join('')}
    </tbody><tfoot><tr><td>Total</td><td class="hide-m"></td><td class="hide-m"></td><td style="text-align:right">${T.n}</td><td class="numc">${money(T.cash)}</td><td class="numc eqc-t">${money(T.eq)}</td><td class="numc hide-m">${money(T.held)}</td></tr></tfoot></table></div>` : `<div class="card empty"><h4>No companies yet</h4><p>Companies are created automatically when you add a contact with a company name.</p></div>`}`
  };
};
function companyForm(c = {}) {
  return `<label class="f"><span>Name</span><input type="text" name="name" value="${esc(c.name)}" required></label>
  <div class="grid2"><label class="f"><span>Website / domain</span><input type="text" name="domain" value="${esc(c.domain)}"></label>
  <label class="f"><span>Industry</span><input type="text" name="industry" value="${esc(c.industry)}"></label>
  <label class="f"><span>Phone</span><input type="tel" name="phone" value="${esc(c.phone)}"></label>
  <label class="f"><span>City / state</span><input type="text" name="location" value="${esc(c.location)}"></label></div>
  <label class="f"><span>Notes</span><textarea name="notes">${esc(c.notes)}</textarea></label>`;
}
ACT.newCompany = () => openModal({ title: 'New company', body: companyForm(), submit: async o => { const id = await store.add('companies', Object.assign(o, { createdAt: Date.now(), updatedAt: Date.now() })); openDrawer('company', id); } });
ACT.editCompany = d => openModal({
  title: 'Edit company', body: companyForm(byId('companies', d.id)),
  submit: async o => {
    o.updatedAt = Date.now(); await store.update('companies', d.id, o);
    for (const c of list('contacts').filter(c => c.companyId === d.id)) if (c.companyName !== o.name) await store.update('contacts', c.id, { companyName: o.name });
  }
});
ACT.delCompany = async d => {
  if (!await ask('Delete this company? Contacts stay but lose the link.')) return;
  for (const c of list('contacts').filter(c => c.companyId === d.id)) await store.update('contacts', c.id, { companyId: null });
  await store.remove('companies', d.id); S.drawer = null; schedule(false);
};
DRAWERS.company = co => {
  const cs = list('contacts').filter(c => c.companyId === co.id), ids = new Set(cs.map(c => c.id));
  const deals = dealsForCompany(co);
  const acts = list('activities').filter(a => ids.has(a.contactId)).sort((a, b) => b.at - a.at).slice(0, 50);
  return `<div class="dh"><span class="avatar lg">${ic('building').replace('<svg', '<svg width="20" height="20"')}</span><div><h2>${esc(co.name)}</h2><div class="sub">${esc([co.industry, co.location].filter(Boolean).join(' · '))}</div></div><button class="x" data-act="closeDrawer">×</button></div>
  <div class="acts"><button class="btn sm" data-act="newContact" data-company="${co.id}">${ic('plus')}Contact</button><button class="btn sm" data-act="editCompany" data-id="${co.id}">Edit</button><button class="btn sm ghost danger" data-act="delCompany" data-id="${co.id}">${ic('trash')}</button></div>
  <div class="db">
    <div class="card"><div class="bd"><dl class="kv"><dt>Website</dt><dd>${co.domain ? `<a href="${esc(/^https?:/.test(co.domain) ? co.domain : 'https://' + co.domain)}" target="_blank" rel="noopener">${esc(co.domain)}</a>` : '—'}</dd><dt>Phone</dt><dd>${esc(co.phone || '—')}</dd><dt>Notes</dt><dd style="white-space:pre-wrap">${esc(co.notes || '—')}</dd></dl></div></div>
    ${advisoryCard(co)}
    ${companyRevenueCard(co)}
    <div class="card"><div class="hd"><h3>Contacts (${cs.length})</h3></div>${cs.map(c => `<div class="taskrow" style="cursor:pointer" data-act="openContact" data-id="${c.id}"><span class="avatar">${initials(fullName(c))}</span><div style="flex:1"><div class="tt">${esc(fullName(c))}</div><div class="sub">${esc(c.title || c.email || '')}</div></div></div>`).join('') || '<div class="bd muted">None</div>'}</div>
    ${dealsCard(deals, 'data-company="' + co.id + '"')}
    <div class="card"><div class="hd"><h3>Activity</h3></div><div class="bd feed">${acts.map(a => feedItem(a, true)).join('') || '<div class="muted">None</div>'}</div></div>
  </div>`;
};

/* ================= DEALS ================= */
function dealCard(d) {
  const c = byId('contacts', d.contactId), cl = byId('clients', d.clientId), co = byId('companies', d.companyId), fee = feeOf(d);
  const who = isCompanyDeal(d)
    ? (co ? ic('building').replace('<svg', '<svg width="11" height="11" style="vertical-align:-1px;color:var(--gold-2)"') + ' ' + esc(co.name) : esc(c ? fullName(c) : 'No company'))
    : (cl ? ic('client').replace('<svg', '<svg width="11" height="11" style="vertical-align:-1px;color:var(--gold-2)"') + ' ' + esc(cl.name) : esc(co ? co.name : c ? fullName(c) : 'No contact'));
  const amtLine = fee ? `<span class="amt">${money(fee.cash)}</span> <span class="eqc-t" style="font-weight:600">+ ${money(fee.equity)} eq</span>` : `<span class="amt">${money(d.amount)}</span>`;
  return `<div class="dcard" draggable="true" data-id="${d.id}" data-act="openDeal"><div class="dn">${esc(d.name)}</div><div class="sub">${who}</div>
    ${fee ? `<div class="sub" style="margin-top:3px">${money(fee.pv)} project · ${esc(fee.bps)} bps</div>` : ''}
    <div class="dm"><span>${amtLine}</span><span>${esc(d.owner || '')} · ${ago(d.stageChangedAt).replace(' ago', '')}</span></div></div>`;
}
function boardColumns(stageList, ds) {
  return `<div class="board${stageList.length <= 3 ? ' wide3' : ''}">${stageList.map(s => {
    const cards = ds.filter(d => shownStage(d) === s.id).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    const sp = cards.reduce((a, d) => { const x = dealSplit(d); a.cash += x.cash; a.eq += x.eq; return a; }, { cash: 0, eq: 0 });
    return `<div class="colm ${s.kind || ''}" data-stage="${esc(s.id)}"><div class="ch"><div class="n"><span>${esc(s.name)}</span><span class="muted">${cards.length}</span></div><div class="t">${money(sp.cash)}${sp.eq ? ` <span class="eqc-t">+ ${money(sp.eq)} equity</span>` : ''}</div></div>
      <div class="cards">${cards.map(dealCard).join('')}</div></div>`;
  }).join('')}</div>`;
}
VIEWS.deals = () => {
  const f = S.f, tab = f.dealTab || 'client';
  let all = list('deals');
  if (f.owner) all = all.filter(d => d.owner === f.owner);
  const q = norm(f.q);
  if (q) all = all.filter(d => [d.name, fullName(byId('contacts', d.contactId)), (byId('clients', d.clientId) || {}).name, (byId('companies', d.companyId) || {}).name].some(x => norm(x).includes(q)));
  const coDeals = all.filter(isCompanyDeal), clDeals = all.filter(d => !isCompanyDeal(d));
  const sum = ds => { const o = ds.filter(d => stageKind(d.stage) === 'open'); const sp = o.reduce((a, d) => { const x = dealSplit(d); a.cash += x.cash; a.eq += x.eq; return a; }, { cash: 0, eq: 0 }); return { n: o.length, cash: sp.cash, eq: sp.eq }; };
  const sc = sum(clDeals), sco = sum(coDeals);
  const tabBtn = (k, label, s) => `<button class="dtab${tab === k ? ' on' : ''}" data-act="dealTab" data-v="${k}"><span class="dtl">${ic(k === 'client' ? 'client' : 'building')}${label}</span><span class="dts">${plural(s.n, 'open deal')} · ${money(s.cash)}${s.eq ? ` <span class="eqc-t">+ ${money(s.eq)} equity</span>` : ''}</span></button>`;
  return {
    title: 'Deals', actions: `<button class="btn primary" data-act="newDeal" data-pipeline="${tab}">${ic('plus')}New ${tab === 'company' ? 'company' : 'client'} deal</button>`,
    body: `<div class="dtabs">${tabBtn('client', 'Client deals', sc)}${tabBtn('company', 'Company deals', sco)}</div>
    <div class="toolbar"><input type="search" class="search" placeholder="Search deals, clients, companies" data-keep="cq" data-input="cq" value="${esc(f.q)}">
      <select data-change="cf" data-k="owner">${opt('', 'All owners', f.owner)}${team().map(t => opt(t.name, t.name, f.owner)).join('')}</select>
      <span class="hint hide-m">${tab === 'company' ? 'Company projects are Open until they close. Moving one to Closed invoices the cash fee and tracks the equity.' : 'Drag cards between stages. Stage changes can trigger workflows.'}</span></div>
    ${tab === 'company' ? boardColumns(COMPANY_STAGES, coDeals) : boardColumns(stages(), clDeals)}`
  };
};

/* ---------- deals attached to clients & companies ---------- */
function dealsForClient(cl) {
  const ids = new Set(cl.contactIds || []);
  return list('deals').filter(d => d.clientId === cl.id || (!d.clientId && d.contactId && ids.has(d.contactId)));
}
function dealsForCompany(co) {
  const ids = new Set(list('contacts').filter(c => c.companyId === co.id).map(c => c.id));
  const cls = new Set(list('clients').filter(cl => (cl.contactIds || []).some(id => ids.has(id))).map(cl => cl.id));
  return list('deals').filter(d => d.companyId === co.id || (!d.companyId && ((d.contactId && ids.has(d.contactId)) || (d.clientId && cls.has(d.clientId)))));
}
function dealsCard(deals, attrs) {
  const open = deals.filter(d => stageKind(d.stage) === 'open').sort((a, b) => (+b.amount || 0) - (+a.amount || 0));
  const closed = deals.filter(d => stageKind(d.stage) !== 'open').sort((a, b) => (b.stageChangedAt || 0) - (a.stageChangedAt || 0));
  const won = closed.filter(d => stageKind(d.stage) === 'won');
  const row = d => {
    const c = byId('contacts', d.contactId), k = stageKind(d.stage);
    const got = list('revenue').filter(r => r.dealId === d.id && r.status === 'paid').reduce((a, r) => a + (+r.amount || 0), 0);
    return `<div class="taskrow" style="cursor:pointer" data-act="openDeal" data-id="${d.id}"><span class="sdot ${k === 'won' ? 's-implemented' : k === 'lost' ? '' : 'up'}"></span>
      <div style="flex:1;min-width:0"><div class="tt">${esc(d.name)}</div><div class="sub"><span class="pill ${k === 'won' ? 'green' : ''}">${esc(stageOf(shownStage(d)).name)}</span> ${c ? esc(fullName(c)) + ' · ' : ''}${esc(d.owner || '')}${k === 'open' && d.closeDate ? ' · close ' + fmtDate(d.closeDate) : k !== 'open' ? ' · ' + fmtDate(d.stageChangedAt) : ''}</div></div>
      <div style="text-align:right;white-space:nowrap"><b>${money(d.amount)}</b>${got ? `<div class="sub">${money(got)} collected</div>` : ''}</div></div>`;
  };
  return `<div class="card"><div class="hd"><h3>Deals</h3><div class="row" style="gap:10px"><span class="sub">${open.length} open · ${money(open.reduce((a, d) => a + (+d.amount || 0), 0))}${won.length ? ' · ' + won.length + ' signed' : ''}</span><button class="btn sm primary" data-act="newDeal" ${attrs}>${ic('plus')}Deal</button></div></div>
    ${open.map(row).join('') || '<div class="bd muted">No open deals.</div>'}
    ${closed.length ? `<details class="closed"><summary>Signed and lost (${closed.length})</summary>${closed.map(row).join('')}</details>` : ''}</div>`;
}

VIEWS.tasks = () => {
  const a = S.f.assignee;

/* ================= CLIENTS =================
   Households and people the firm is actively serving: tier, designations,
   strategies being implemented, work in progress/done, and check-in cadence. */
ICONS.client = '<path d="M12 3 4 6v6c0 4.5 3.4 8.2 8 9 4.6-.8 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>';
const TIERS = [['platinum', 'Platinum'], ['gold', 'Gold'], ['silver', 'Silver'], ['special', 'Special']];
const STD_TIERS = TIERS.filter(t => t[0] !== 'special');
const TIER_RANK = { platinum: 0, gold: 1, silver: 2, special: 3 };
const DESIGNATIONS = [['reps', 'Real estate professional (REPS)', 'REPS'], ['str', 'Short-term rental (material participation)', 'STR'], ['bizowner', 'Business owner', 'Business owner'], ['w2', 'W-2 employee', 'W-2']];
const STRATEGY_PRESETS = ['Cost segregation', 'Short-term rental strategy', 'Real estate professional status', 'Entity structuring', 'Equipment rental program', 'Investment planning', 'Retirement plan design', 'Charitable planning'];
const WORK_PRESETS = ['Estate and will planning', 'Trust drafting', 'Company reorganization', 'Entity formation', 'Cost segregation study', 'Tax projection', 'Quarterly review', 'Engagement letter'];
const STRAT_STATUS = [['planned', 'Planned'], ['progress', 'In progress'], ['implemented', 'Implemented'], ['paused', 'On hold']];
const WORK_STATUS = [['todo', 'Not started'], ['progress', 'In progress'], ['done', 'Done']];
const CLIENT_STATUS = [['onboarding', 'Onboarding'], ['active', 'Active'], ['paused', 'Paused'], ['former', 'Former']];
const handledBy = () => [firmName(), 'Providence Law'];
const CHANNELS = { call: ['Call', 'phone'], meeting: ['Meeting', 'users'], email: ['Email', 'mail'], text: ['Text', 'phone'] };
const DEFAULT_CADENCE = { platinum: 30, gold: 45, silver: 60, special: 45 };
const lbl = (arr, v) => (arr.find(x => x[0] === v) || [v, v])[1];

function cadenceDays(tier) { const c = (S.settings.general || {}).cadence || {}; return Number(c[tier]) || DEFAULT_CADENCE[tier] || 60; }
function clientContacts(cl) { return (cl.contactIds || []).map(id => byId('contacts', id)).filter(Boolean); }
function clientOf(contactId) { return list('clients').find(cl => (cl.contactIds || []).includes(contactId)) || null; }
function lastContact(cl) {
  let t = cl.lastContactAt || 0;
  clientContacts(cl).forEach(c => { t = Math.max(t, c.lastContactAt || 0, c.lastEmailedAt || 0); });
  return t || null;
}
function checkin(cl) {
  const last = lastContact(cl), days = cadenceDays(cl.tier);
  const due = (last || cl.since || cl.createdAt || Date.now()) + days * DAY;
  const left = Math.ceil((due - Date.now()) / DAY);
  return { last, due, left, days, cls: left < 0 ? 'red' : left <= 7 ? 'amber' : 'green' };
}
function daysAgo(t) { if (!t) return 'Never'; const d = Math.round((startOfDay() - startOfDay(t)) / DAY); return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago'; }
function checkinText(ck) { return ck.left < 0 ? plural(-ck.left, 'day') + ' overdue' : ck.left === 0 ? 'due today' : 'due in ' + plural(ck.left, 'day'); }
const tierPill = t => t ? `<span class="pill tier-${esc(t)}">${esc(lbl(TIERS, t))}</span>` : '';
const desigChips = cl => (cl.designations || []).map(d => `<span class="tag desig">${esc((DESIGNATIONS.find(x => x[0] === d) || [d, d, d])[2])}</span>`).join('');
const stratChip = s => `<span class="schip s-${esc(s.status || 'planned')}" title="${esc(lbl(STRAT_STATUS, s.status))}">${esc(s.name)}</span>`;

VIEWS.clients = () => {
  const f = S.f; let cls = list('clients').slice();
  const q = norm(f.q);
  if (q) cls = cls.filter(cl => [cl.name].concat(clientContacts(cl).map(fullName), (cl.strategies || []).map(s => s.name), (cl.work || []).map(w => w.type)).some(x => norm(x).includes(q)));
  if (f.tier) cls = cls.filter(cl => cl.tier === f.tier);
  if (f.desig) cls = cls.filter(cl => (cl.designations || []).includes(f.desig));
  if (f.cstatus === 'due') cls = cls.filter(cl => cl.status !== 'former' && checkin(cl).left <= 7);
  else if (f.cstatus) cls = cls.filter(cl => (cl.status || 'active') === f.cstatus);
  else cls = cls.filter(cl => cl.status !== 'former');
  if (f.owner) cls = cls.filter(cl => cl.owner === f.owner);
  const sort = f.csort || 'checkin';
  if (sort === 'revenue') { const v = {}; cls.forEach(cl => { const m = clientMoney(cl); v[cl.id] = m.last12 + m.arr; }); cls.sort((a, b) => v[b.id] - v[a.id]); }

    <label class="f" id="specialFeeRow" style="${cl.tier === 'special' ? '' : 'display:none'}"><span>Special quarterly fee ($)</span><input type="text" inputmode="decimal" name="customFee" value="${cl.customFee ? esc(cl.customFee) : ''}" placeholder="e.g. 5,500" data-input="signSum"></label>

  </div>
  <div class="secthd">Designations</div>

    <div class="grid3"><label class="f"><span>Startup fee ($)</span><input type="text" inputmode="decimal" name="startup" value="${tierStartup(cl.tier || 'gold') || ''}" placeholder="0" data-input="signSum"></label>

    <div id="signSum" class="signsum"></div></div>
    <div class="hint">Add strategies and work items from the client page after saving.</div>`}`;
}
function clientFromForm(o, existing) {
  const ids = (existing && existing.contactIds || []).filter(id => id !== o.primary);
  return {
    name: o.name, tier: o.tier, customFee: o.tier === 'special' ? num(o.customFee) : null, status: o.status, owner: o.owner, since: fromDateInput(o.since), nextReview: fromDateInput(o.nextReview),
    designations: DESIGNATIONS.map(d => d[0]).filter(k => o['d_' + k]), notes: o.notes || '',

CHANGE.tierPick = (d, t) => {
  const f = $('#mform'), row = $('#specialFeeRow');
  if (row) row.style.display = t.value === 'special' ? '' : 'none';
  if (t.value === 'special' && f) setTimeout(() => f.elements.customFee.focus());
  if (f && f.elements.startup && t.value !== 'special') f.elements.startup.value = tierStartup(t.value) || f.elements.startup.value || '';
  INPUT.signSum();
};
const formFee = f => f.elements.tier.value === 'special' ? num(f.elements.customFee.value) : tierFee(f.elements.tier.value);
CHANGE.signSum = () => INPUT.signSum();
CHANGE.sinceDate = () => INPUT.signSum();
INPUT.signSum = () => {
  const f = $('#mform'), out = $('#signSum'); if (!f || !out || !f.elements.startup) return;
  const tier = f.elements.tier.value, fee = formFee(f), sign = fromDateInput(f.elements.since.value) || Date.now(), so = signOnPlan(sign);
  const st = num(f.elements.startup.value), split = f.elements.splitStartup.checked, bill = f.elements.tierPlan.checked;
  const rows = [];
  if (st) rows.push(split ? `<li>Startup fee <b>${cash(st)}</b> in two invoices: ${cash(st / 2)} at signing, ${cash(st / 2)} 30 days later</li>` : `<li>Startup fee <b>${cash(st)}</b> invoiced at signing</li>`);
  if (bill) {
    if (so.chargeNow) rows.push(`<li>${esc(periodLabel(so.planStart, 'quarterly'))} quarterly fee <b>${cash(fee)}</b> invoiced at signing</li>`);
    rows.push(`<li>Then <b>${cash(fee)}</b> every quarter starting <b>${fmtDate(so.nextQ)}</b>${so.chargeNow ? '' : ' <span class="sub">(next quarter starts within 2 weeks, so this quarter is not charged)</span>'}</li>`);
  }
  out.innerHTML = rows.length ? `<div class="l">Signing ${fmtDate(sign)}</div><ul>${rows.join('')}</ul>` : '<span class="muted">Nothing will be billed at signing.</span>';

ACT.newClient = d => {
  const c = d.contact && byId('contacts', d.contact);
  const pre = c ? { name: fullName(c), contactIds: [c.id], owner: c.owner } : {};
  if (c && c.companyName && !c.lastName) pre.name = c.companyName;
  openModal({
    title: c ? 'Make ' + fullName(c) + ' a client' : 'New client', wide: true, body: clientForm(pre), onMount: () => INPUT.signSum(),
    submit: async o => {
      if (!o.name) return false;
      const data = Object.assign(clientFromForm(o, pre), { strategies: [], work: [], feePlans: [], createdAt: Date.now(), createdBy: meName() });
      const sign = data.since || Date.now(), so = signOnPlan(sign), fee = feeFor(data);
      if (o.tierPlan && data.tier === 'special' && !fee) { toast('Enter the Special quarterly fee, or uncheck "Bill the quarterly tier fee"', 'error'); return false; }
      const tp = o.tierPlan ? newTierPlan(data.tier, so.planStart, fee) : null;
      if (tp) data.feePlans.push(tp);
      const id = await store.add('clients', data);
      const base = { clientId: id, companyId: null, dealId: null, contactId: data.contactIds[0] || null, paidBy: 'Client', notes: '', createdAt: Date.now(), createdBy: meName(), updatedAt: Date.now() };
      const st = num(o.startup);
      if (st) {
        if (o.splitStartup) {
          const half = round2(st / 2);
          await store.add('revenue', Object.assign({}, base, { type: 'startup', billing: 'project', amount: half, status: 'invoiced', date: sign, description: 'Startup fee (1 of 2)' }));
          await store.add('revenue', Object.assign({}, base, { type: 'startup', billing: 'project', amount: round2(st - half), status: 'expected', date: sign + 30 * DAY, description: 'Startup fee (2 of 2)' }));
        } else await store.add('revenue', Object.assign({}, base, { type: 'startup', billing: 'project', amount: st, status: 'invoiced', date: sign, description: 'Startup fee' }));
      }
      if (tp && so.chargeNow) await store.add('revenue', Object.assign({}, base, { type: 'quarterly', billing: 'quarterly', planId: tp.id, period: periodKey(so.planStart), dueDate: sign, amount: fee, status: 'invoiced', date: sign, description: tp.label + ' · ' + periodLabel(so.planStart, 'quarterly') + ' (first quarter, at signing)' }));
      await logAct({ type: 'system', clientId: id, contactId: data.contactIds[0] || null, body: 'Became a ' + lbl(TIERS, data.tier) + ' client' + (o.tierPlan ? ' at ' + cash(fee) + ' per quarter' : '') + (st ? '. Startup fee ' + cash(st) + ' invoiced' : '') + (tp && so.chargeNow ? '. ' + periodLabel(so.planStart, 'quarterly') + ' fee invoiced at signing' : tp ? '. First quarterly charge ' + fmtDate(so.nextQ) : '') });
      toast('Client added'); openDrawer('client', id);
    }
  });
};
ACT.editClient = d => {
  const cl = byId('clients', d.id);
  openModal({
    title: 'Edit client', wide: true, body: clientForm(cl),
    submit: async o => {
      const data = clientFromForm(o, cl);
      await store.update('clients', cl.id, data);
      const specialChanged = data.tier === 'special' && cl.tier === 'special' && Number(data.customFee) !== Number(cl.customFee);
      if (data.tier === 'special' && !data.customFee) toast('Add the Special quarterly fee amount so it can be billed', 'error');
      if (data.tier !== cl.tier || specialChanged) {
        if (data.tier !== cl.tier) await logAct({ type: 'system', clientId: cl.id, body: 'Tier changed: ' + lbl(TIERS, cl.tier) + ' → ' + lbl(TIERS, data.tier) });
        const tp = tierPlanOf(cl), newAmt = feeFor(data);
        if (tp && newAmt && Number(tp.amount) !== newAmt && await ask('Update their quarterly fee from ' + cash(tp.amount) + ' to ' + cash(newAmt) + ' (' + (data.tier === 'special' ? 'special pricing' : lbl(TIERS, data.tier) + ' price') + ')? Payments already recorded stay as they are.', 'Update fee')) {
          await patchList(cl.id, 'feePlans', a => { const x = a.find(x => x.id === tp.id); x.amount = newAmt; x.label = String(x.label || '').replace(lbl(TIERS, cl.tier), lbl(TIERS, data.tier)) || lbl(TIERS, data.tier) + ' quarterly strategy fee'; }, 'Quarterly fee updated to ' + cash(newAmt) + ' (' + lbl(TIERS, data.tier) + ')');
        } else if (!tp) toast('Tier changed. Add their ' + lbl(TIERS, data.tier) + ' fee plan from the Revenue section.');
      }
      if (data.status !== cl.status) await logAct({ type: 'system', clientId: cl.id, body: 'Status changed to ' + lbl(CLIENT_STATUS, data.status) });
      toast('Saved');
    }
  });
};

/* ================= REVENUE =================
   Every dollar is a ledger entry in `revenue`, tied to a client and optionally
   a company, contact and deal. Recurring fees (quarterly tier fees, retainers)

ICONS.dollar = '<path d="M12 2v20M17 6.5C16.2 5 14.4 4 12 4 9 4 7 5.5 7 7.75S9 11 12 11.5s5 1.5 5 3.75S15 19 12 19c-2.4 0-4.2-1-5-2.5"/>';

const REV_STATUS = [['paid', 'Paid'], ['invoiced', 'Invoiced'], ['expected', 'Expected'], ['waived', 'Waived / written off']];
const REV_PILL = { paid: 'green', invoiced: 'blue', expected: 'gold', waived: '' };
const FREQ = [['quarterly', 'Quarterly', 3], ['monthly', 'Monthly', 1], ['annual', 'Annually', 12]];
const REV_COLOR = { retainer: '#9C7A2E', quarterly: '#C8A24B', startup: '#2B5FA8', deal: '#2E7D4F', consulting: '#7A5BB0', commission: '#C2703D', other: '#98A1AF' };
const DEFAULT_TIER_FEES = { platinum: 8000, gold: 3900, silver: 2500 }; // per quarter

const amt = r => Number(r && r.amount) || 0;
const cash = n => { n = Math.round((Number(n) || 0) * 100) / 100; return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const total = arr => arr.reduce((a, r) => a + amt(r), 0);
const yearStart = (t = Date.now()) => new Date(new Date(t).getFullYear(), 0, 1).getTime();
const quarterStart = (t = Date.now()) => { const d = new Date(t); return new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1).getTime(); };
function addMonths(ts, m) { const d = new Date(ts), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return d.getTime(); }
const periodKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
function periodLabel(ts, freq) {
  const d = new Date(ts);
  if (freq === 'quarterly') return 'Q' + (Math.floor(d.getMonth() / 3) + 1) + ' ' + d.getFullYear();
  if (freq === 'annual') return String(d.getFullYear());
  return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}
const freqStep = f => (FREQ.find(x => x[0] === f) || FREQ[0])[2];
const annualized = p => (Number(p.amount) || 0) * 12 / freqStep(p.frequency);
const planActive = p => p.active !== false && (!p.end || p.end >= startOfDay());
const payerOf = r => r.paidBy || 'Client';

/* ---------- billing type: how a dollar is billed ---------- */
const BILLING = [['project', 'Per project'], ['monthly', 'Monthly'], ['quarterly', 'Quarterly'], ['annual', 'Annual']];
const BILL_COLOR = { project: '#2E7D4F', monthly: '#9C7A2E', quarterly: '#C8A24B', annual: '#5B6B7C' };
const freqToBilling = f => f === 'annual' ? 'annual' : f === 'monthly' ? 'monthly' : 'quarterly';
let _planCache = { cl: null, co: null, map: null };
function allPlans() {
  const cl = list('clients'), co = list('companies');
  if (_planCache.cl === cl && _planCache.co === co && _planCache.list) return _planCache.list;
  const out = [];
  cl.forEach(x => (x.feePlans || []).forEach(p => out.push(withOwner(p, 'clients', x.id))));
  co.forEach(x => (x.feePlans || []).forEach(p => out.push(withOwner(p, 'companies', x.id))));
  _planCache = { cl, co, list: out, map: new Map(out.map(p => [p.id, p])) };
  return out;
}
const planById = id => { allPlans(); return _planCache.map.get(id) || null; };
function withOwner(p, col, id) { return Object.assign({}, p, { ownerCol: col, ownerId: id, clientId: col === 'clients' ? id : null }); }
const ownerOf = p => byId(p.ownerCol, p.ownerId);
function billingOf(r) {
  if (r.billing) return r.billing;
  if (r.planId) { const p = planById(r.planId); if (p) return freqToBilling(p.frequency); }

  if (r.type === 'retainer') return 'monthly';

}
/* Collected, recurring, outstanding and payers for each billing type. */
function billingBreakdown(entries, plans, due) {
  const now = Date.now(), t0 = startOfDay(), out = {};
  BILLING.forEach(b => out[b[0]] = { ytd: 0, last12: 0, lifetime: 0, arr: 0, overdue: 0, upcoming: 0, payers: new Set(), plans: 0 });
  entries.forEach(r => {
    if (r.status !== 'paid') return; const x = out[billingOf(r)]; if (!x) return;
    x.lifetime += amt(r); if (r.date >= yearStart()) x.ytd += amt(r); if (r.date >= now - 365 * DAY) x.last12 += amt(r);
    x.payers.add(r.clientId ? 'cl:' + r.clientId : r.companyId ? 'co:' + r.companyId : 'x:' + payerOf(r));
  });
  plans.forEach(p => { if (!planActive(p)) return; const x = out[freqToBilling(p.frequency)]; x.arr += annualized(p); x.plans++; x.payers.add(p.ownerCol === 'companies' ? 'co:' + p.ownerId : 'cl:' + p.ownerId); });
  (due || []).forEach(d => { const k = d.kind === 'plan' ? freqToBilling(d.plan.frequency) : billingOf(d.entry); const x = out[k]; if (!x) return; if (d.due < t0) x.overdue += d.amount; else x.upcoming += d.amount; });
  return out;
}
function billingTiles(bb, compact) {
  const keys = BILLING.map(b => b[0]).filter(k => k !== 'annual' || bb.annual.lifetime || bb.annual.arr);
  return `<div class="billtiles${compact ? ' compact' : ''}">${keys.map(k => { const x = bb[k], rec = k !== 'project';
    return `<div class="billtile"><div class="l"><i class="kdot" style="background:${BILL_COLOR[k]}"></i>${esc(lbl(BILLING, k))}</div>
      <div class="v">${cash(compact ? x.last12 : x.ytd)}</div><div class="sub">${compact ? 'last 12 months' : 'collected this year'}</div>
      ${rec ? `<div class="sub"><b style="color:var(--ink)">${cash(x.arr)}</b>/yr from ${plural(x.plans, 'plan')}</div>` : `<div class="sub">${compact ? cash(x.lifetime) + ' lifetime' : cash(x.last12) + ' last 12 months'}</div>`}
      ${x.overdue ? `<div class="sub" style="color:var(--red)">${cash(x.overdue)} past due</div>` : x.upcoming ? `<div class="sub">${cash(x.upcoming)} due next 90 days</div>` : ''}
      ${compact ? '' : `<div class="sub">${plural(x.payers.size, 'payer')}</div>`}</div>`; }).join('')}</div>`;
}

const quarterKey = ts => { const d = new Date(ts); return d.getFullYear() + '-Q' + (Math.floor(d.getMonth() / 3) + 1); };
const entryQuarter = r => { if (r.period && /^\d{4}-\d{2}$/.test(r.period)) { const [y, m] = r.period.split('-').map(Number); return y + '-Q' + Math.ceil(m / 3); } return quarterKey(r.dueDate || r.date); };
const nextQuarterStart = (t = Date.now()) => addMonths(quarterStart(t), 3);
/* Quarterly plans always bill on the first day of each quarter (Jan 1, Apr 1, Jul 1, Oct 1). */
function installments(plan, until) {
  const out = []; if (!plan.start) return out;
  const paid = list('revenue').filter(r => r.planId === plan.id);
  const qtr = plan.frequency === 'quarterly', first = qtr ? quarterStart(plan.start) : plan.start;
  for (let k = 0; k < 600; k++) {
    const due = addMonths(first, k * freqStep(plan.frequency));
    if (due > until || (plan.end && due > plan.end)) break;
    const key = periodKey(due), qk = qtr ? quarterKey(due) : null;

/* Sign-on rule: charge the startup fee and the current quarter at signing,
   unless the next quarter starts within 2 weeks; then the first quarterly
   charge is that next quarter's first day. */
function signOnPlan(signTs) {
  const nq = nextQuarterStart(signTs), chargeNow = nq - startOfDay(signTs) > 14 * DAY;
  return { chargeNow, planStart: chargeNow ? quarterStart(signTs) : nq, nextQ: nq };
}

function moneyFor(entries, plans, clientOfPlan) {

  const byType = {}; paid.forEach(r => byType[r.type] = (byType[r.type] || 0) + amt(r));
  const due = [];
  plans.forEach(p => {
    if (p.active === false) return;
    installments(p, horizon).forEach(i => { if (!i.entry) due.push({ kind: 'plan', plan: p, client: ownerOf(p), due: i.due, key: i.key, amount: Number(p.amount) || 0, label: p.label + ' · ' + periodLabel(i.due, p.frequency) }); });
  });
  entries.filter(r => r.status === 'invoiced' || r.status === 'expected').forEach(r => { if ((r.date || 0) <= horizon) due.push({ kind: 'entry', entry: r, due: r.date || now, amount: amt(r), label: r.description || lbl(REV_TYPES, r.type) }); });

    qtd: total(paid.filter(r => r.date >= quarterStart())),
    arr: plans.filter(planActive).reduce((a, p) => a + annualized(p), 0),
    overdue: due.filter(x => x.due < t0).reduce((a, x) => a + x.amount, 0),

const clientMoney = cl => moneyFor(list('revenue').filter(r => r.clientId === cl.id), (cl.feePlans || []).map(p => withOwner(p, 'clients', cl.id)));

  const entries = list('revenue').filter(r => r.companyId === co.id || (r.clientId && clientIds.has(r.clientId)));
  const plans = allPlans().filter(p => (p.ownerCol === 'companies' && p.ownerId === co.id) || (p.ownerCol === 'clients' && (clientIds.has(p.ownerId) || p.companyId === co.id)));

}
function sourceName(r) { const cl = byId('clients', r.clientId); if (cl) return cl.name; const co = byId('companies', r.companyId); if (co) return co.name; const c = byId('contacts', r.contactId); return c ? fullName(c) : 'Unassigned'; }

CHANGE.revType = (d, t) => { const r = $('#splitRow'); if (r) { r.style.display = t.value === 'startup' ? '' : 'none'; r.querySelector('input').checked = t.value === 'startup'; } };

ACT.newRev = d => {
  const deal = byId('deals', d.deal);
  const pre = { clientId: d.client || (deal && (deal.clientId || (deal.contactId && clientOf(deal.contactId) ? clientOf(deal.contactId).id : ''))), companyId: d.company || (deal && deal.companyId) || '', dealId: d.deal || '', type: d.type || 'deal', amount: d.amount || (deal && deal.amount) || '', description: deal ? deal.name : '' };

/* ---------- firm-wide revenue page ---------- */
VIEWS.revenue = () => {
  const f = S.f, m = firmMoney();
  let rs = list('revenue').slice();
  if (f.ryear) rs = rs.filter(r => new Date(r.date).getFullYear() === +f.ryear);
  if (f.rtype) rs = rs.filter(r => r.type === f.rtype);
  if (f.rstatus) rs = rs.filter(r => r.status === f.rstatus);
  if (f.rclient) rs = rs.filter(r => r.clientId === f.rclient);
  if (f.rpayer) rs = rs.filter(r => payerOf(r) === f.rpayer);
  if (f.rbill) rs = rs.filter(r => billingOf(r) === f.rbill);
  const q = norm(f.q); if (q) rs = rs.filter(r => [sourceName(r), r.description, r.notes, payerOf(r)].some(x => norm(x).includes(q)));
  const years = Array.from(new Set(list('revenue').map(r => new Date(r.date).getFullYear()))).sort((a, b) => b - a);
  const payers = Array.from(new Set(list('revenue').map(payerOf))).sort();
  const filteredPaid = rs.filter(r => r.status === 'paid');
  const byClient = {}; m.paid.filter(r => r.date >= Date.now() - 365 * DAY).forEach(r => { const k = r.clientId || ('x:' + sourceName(r)); byClient[k] = (byClient[k] || 0) + amt(r); });
